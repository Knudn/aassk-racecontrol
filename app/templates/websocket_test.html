<!DOCTYPE html>
<html>
<head>
    <title>InfoScreen Display</title>
    <script src="{{url_for('static', filename='js/socket.io.js')}}"></script>
    <script>
        // Generate or get session ID from URL
        let params = new URLSearchParams(document.location.search);
        let websocket_session_id = params.get("id");
        if (websocket_session_id === null) {
            websocket_session_id = (Math.random() * 0xfffff * 1000000).toString(16);
            websocket_session_id = websocket_session_id.slice(0, 8);
        }
        

        document.addEventListener('DOMContentLoaded', function() {
            var socket = io.connect('http://' + document.domain + ':' + location.port);
            var contentArea = document.getElementById('content-area');
            var statusDot = document.getElementById('status-dot');
            
            // Update status indicator
            function updateStatus(connected) {
                if (connected) {
                    statusDot.classList.add('connected');
                    statusDot.title = 'Connected';
                } else {
                    statusDot.classList.remove('connected');
                    statusDot.title = 'Disconnected';
                }
            }
            
            socket.on('connect', function() {
                console.log('Connected to the server');
                updateStatus(true);
                
                // Join the infoscreen room with session ID as username
                socket.emit('join', { 
                    username: websocket_session_id, 
                    room: 'infoscreen',
                    hostname: window.location.hostname
                });
                
                document.getElementById('client-id').textContent = websocket_session_id;
            });
            
            socket.on('disconnect', function() {
                console.log('Disconnected from server');
                updateStatus(false);
            });
            
            // Listen for the standard response event
            socket.on('response', function(dataString) {
                console.log(dataString)
                // Replace the content area with data from WebSocket
                contentArea.innerHTML = dataString;
                console.log('Content updated');
            });

            // Also register for 'joined' event to confirm room joining
            socket.on('joined', function(data) {
                console.log('Joined room:', data.room);
            });
            
        });
    </script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #content-area {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        
        #status-container {
            position: fixed;
            top: 5px;
            right: 5px;
            z-index: 1000;
            display: flex;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
        }
        
        #status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: red;
            margin-right: 5px;
        }
        
        #status-dot.connected {
            background-color: lime;
        }
        
        .loading-message {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            padding: 20px;
        }
        
        .loading-message h2 {
            margin-top: 0;
        }
        
        .client-info {
            margin-top: 15px;
            padding: 5px 10px;
            background-color: #f0f0f0;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="status-container">
        <div id="status-dot" title="Disconnected"></div>
        <span>ID: <span id="client-id">...</span></span>
    </div>
    
    <div id="content-area">
        <div class="loading-message">
            <h2>InfoScreen Display</h2>
            <p>Waiting for content from server...</p>
            <div class="client-info">
                Client ID: <span id="client-id">...</span>
            </div>
        </div>
    </div>
</body>
</html>
