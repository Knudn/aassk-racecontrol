<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultater – Aktiv</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            background: transparent;
            font-family: 'Inter', 'Arial', sans-serif;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%; height: 100%;
            position: relative;
        }

        /* ── Header ── */
        #page-header {
            flex-shrink: 0;
            align-self: center;
            width: fit-content;
            padding: 8px 28px;
            text-align: center;
            background: rgba(14, 16, 28, 0.98);
            border-radius: 8px 8px 0 0;
            position: relative;
            z-index: 2;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #page-header.show { opacity: 1; transform: translateY(0); }

        #title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        #result-label {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
        }

        .sep {
            font-size: 13px;
            font-weight: 300;
            color: rgba(255,255,255,0.35);
            line-height: 1;
        }

        #title {
            font-size: 15px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.3px;
        }

        #heat-label {
            font-size: 15px;
            font-weight: 400;
            color: #fff;
            letter-spacing: -0.2px;
        }

        /* ── Main card ── */
        #table-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 16px 14px;
            gap: 2px;
            overflow: hidden;
            background: rgba(10, 12, 20, 0.97);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.07);
            position: relative;
            z-index: 1;
        }

        /* ── Column header row ── */
        #col-headers {
            display: flex;
            align-items: center;
            padding: 10px 0 6px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.25s ease 0.15s;
        }
        #col-headers.show { opacity: 1; }

        .ch {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.55);
            white-space: nowrap;
            overflow: hidden;
        }
        .ch.right  { text-align: right; }
        .ch.center { text-align: center; }

        /* ── Data row slice ── */
        .row-slice {
            display: flex;
            align-items: center;
            height: 56px;
            background: transparent;
            border-left: 4px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
            opacity: 0;
            transform: translateX(-20px);
            transition: opacity 0.22s ease-out, transform 0.22s ease-out;
        }
        .row-slice.show { opacity: 1; transform: translateX(0); }

        .row-slice.rank-1 { border-left-color: #e8b840; }
        .row-slice.rank-2 { border-left-color: rgba(200,200,215,0.30); }
        .row-slice.rank-3 { border-left-color: #c07030; }
        .row-slice.is-penalty { opacity: 0.30 !important; }

        /* ── Column widths ── */
        .c-pos   { width: 68px;  min-width: 68px;  }
        .c-cid   { width: 56px;  min-width: 56px;  }
        .c-name  { flex: 1;      min-width: 0;     }
        .c-sled  { width: 16%;   min-width: 90px;  }
        .c-time  { width: 118px; min-width: 118px; }
        .c-gap   { width: 108px; min-width: 108px; }
        .c-pts   { width: 62px;  min-width: 62px;  }

        /* ── Cell content ── */
        .cell {
            padding: 0 12px;
            display: flex;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
        }
        .cell.right  { justify-content: flex-end; }
        .cell.center { justify-content: center; }

        .pos-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px; height: 38px;
            border-radius: 6px;
            font-size: 20px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: rgba(255,255,255,0.28);
            background: rgba(255,255,255,0.04);
        }
        .rank-1 .pos-badge { color: #e8b840; background: rgba(232,184,64,0.10); }
        .rank-2 .pos-badge { color: rgba(210,210,225,0.75); background: rgba(210,210,225,0.07); }
        .rank-3 .pos-badge { color: #c07030; background: rgba(192,112,48,0.10); }
        .is-penalty .pos-badge {
            font-size: 11px;
            letter-spacing: 0.5px;
            color: rgba(210,70,70,0.75);
            background: rgba(210,70,70,0.08);
        }

        .val-cid {
            font-size: 17px; font-weight: 600;
            color: rgba(255,255,255,0.60);
            font-variant-numeric: tabular-nums;
        }
        .val-name {
            font-size: 20px; font-weight: 700;
            color: #fff;
            text-overflow: ellipsis; overflow: hidden;
        }
        .val-sled {
            font-size: 14px; font-weight: 500;
            color: rgba(255,255,255,0.65);
            text-overflow: ellipsis; overflow: hidden;
        }
        .val-time {
            font-size: 20px; font-weight: 700;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }
        .val-time.penalty-text {
            font-size: 13px; font-weight: 700;
            letter-spacing: 1px;
            color: rgba(255, 80, 80, 0.90);
        }
        .val-gap {
            font-size: 14px; font-weight: 500;
            color: rgba(255,255,255,0.65);
            font-variant-numeric: tabular-nums;
        }
        .val-pts {
            font-size: 17px; font-weight: 700;
            color: rgba(255,255,255,0.50);
            font-variant-numeric: tabular-nums;
        }
        .val-pts.lit { color: #fff; }
    </style>
</head>
<body>
<div id="app">

    <div id="page-header">
        <div id="title-row">
            <span id="result-label">Resultater</span>
            <span class="sep">·</span>
            <span id="title">—</span>
            <span class="sep">·</span>
            <span id="heat-label">—</span>
        </div>
    </div>

    <div id="table-wrap">
        <div id="col-headers"></div>
        <div id="rows"></div>
    </div>
</div>

<script>
    // ── URL params ───────────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);

    // points: 'false' = skjul poengkolonnen
    const VIS_POENG = params.get('points') !== 'false';

    (function applyParams() {
        const app    = document.getElementById('app');
        const mirror = params.get('mirror') === '1' || params.get('mirror') === 'true';
        const scale  = params.get('scale');
        const w = params.get('w'), h = params.get('h');
        if (w) app.style.width  = w + 'px';
        if (h) app.style.height = h + 'px';

        const opacity = params.get('opacity');
        if (opacity !== null) {
            const alpha = Math.min(1, Math.max(0, parseFloat(opacity)));
            document.getElementById('table-wrap').style.background = `rgba(10, 12, 20, ${alpha})`;
        }

        if (scale) {
            document.body.style.transformOrigin = mirror ? 'top right' : 'top left';
            document.body.style.transform = 'scale(' + parseFloat(scale) + ')';
        }
    })();

    // ── Helpers ──────────────────────────────────────────────────
    const DNX = { DNS: 1, DNF: 1, DSQ: 1, DQ: 1 };
    function isPenalty(val) { return DNX[String(val || '').toUpperCase()] === 1; }

    function rowRankClass(standing, penalty) {
        if (penalty) return 'is-penalty';
        const n = parseInt(standing);
        if (n === 1) return 'rank-1';
        if (n === 2) return 'rank-2';
        if (n === 3) return 'rank-3';
        return '';
    }

    function formatName(f, l) {
        if (!f && !l) return '—';
        if (f === l) return l || '—';
        if (!l) return f;
        if (!f) return l;
        return f.charAt(0) + '. ' + l;
    }

    // Format milliseconds → M:SS.mmm or SS.mmm
    function formatMs(ms) {
        if (!ms || ms <= 0) return '—';
        const totalMs  = Math.round(ms);
        const minutes  = Math.floor(totalMs / 60000);
        const seconds  = Math.floor((totalMs % 60000) / 1000);
        const millis   = totalMs % 1000;
        const secStr   = String(seconds).padStart(minutes > 0 ? 2 : 1, '0');
        const msStr    = String(millis).padStart(3, '0');
        return minutes > 0 ? `${minutes}:${secStr}.${msStr}` : `${secStr}.${msStr}`;
    }

    function formatGap(ms) {
        if (!ms || ms <= 0) return '';
        return '+' + formatMs(ms);
    }

    function div(cls, inner) {
        const el = document.createElement('div');
        el.className = cls;
        if (inner !== undefined) el.textContent = inner;
        return el;
    }

    // ── Build column headers ─────────────────────────────────────
    function buildHeaders() {
        const hdr = document.getElementById('col-headers');
        hdr.innerHTML = '';
        function ch(label, cls) {
            const el = div('ch ' + cls, label);
            hdr.appendChild(el);
        }
        ch('Pos',      'center c-pos');
        ch('#',        'center c-cid');
        ch('Fører',    'c-name');
        ch('Scooter',  'c-sled');
        ch('Tid',      'right c-time');
        ch('Gap',      'right c-gap');
        if (VIS_POENG) ch('Pkt', 'right c-pts');
    }

    // ── Build row ────────────────────────────────────────────────
    function makeRow(d, leaderMs) {
        const penaltyCode = (d.penalty > 0) ? penaltyLabel(d.penalty) : null;
        const isPen = !!penaltyCode;
        const standing = d.internal_standing ?? d.position ?? '';
        const rank = rowRankClass(standing, isPen);
        const row = div('row-slice ' + rank);

        const posCell = div('cell center c-pos');
        const badge = div('pos-badge', isPen ? '' : standing);
        posCell.appendChild(badge);
        row.appendChild(posCell);

        const cidCell = div('cell center c-cid');
        cidCell.appendChild(div('val-cid', d.cid ?? ''));
        row.appendChild(cidCell);

        const nameCell = div('cell c-name');
        nameCell.appendChild(div('val-name', formatName(d.first_name, d.last_name)));
        row.appendChild(nameCell);

        const sledCell = div('cell c-sled');
        sledCell.appendChild(div('val-sled', d.snowmobile || ''));
        row.appendChild(sledCell);

        const timeCell = div('cell right c-time');
        if (isPen) {
            timeCell.appendChild(div('val-time penalty-text', penaltyCode));
        } else {
            const ms = d.finishtime || 0;
            timeCell.appendChild(div('val-time', ms > 0 ? formatMs(ms) : '—'));
        }
        row.appendChild(timeCell);

        const gapCell = div('cell right c-gap');
        if (!isPen && leaderMs > 0) {
            const ms = d.finishtime || 0;
            gapCell.appendChild(div('val-gap', ms > 0 ? formatGap(ms - leaderMs) : ''));
        }
        row.appendChild(gapCell);

        if (VIS_POENG) {
            const ptsCell = div('cell right c-pts');
            ptsCell.appendChild(div('val-pts' + (d.points > 0 ? ' lit' : ''), d.points > 0 ? d.points : ''));
            row.appendChild(ptsCell);
        }

        return row;
    }

    function penaltyLabel(code) {
        const map = { 1: 'DNS', 2: 'DNF', 3: 'DSQ' };
        return map[code] || 'PEN';
    }

    // ── Animation ────────────────────────────────────────────────
    function animateIn(container) {
        document.getElementById('page-header').classList.add('show');
        setTimeout(() => document.getElementById('col-headers').classList.add('show'), 120);
        container.querySelectorAll('.row-slice')
            .forEach((el, i) => setTimeout(() => el.classList.add('show'), 200 + i * 38));
    }

    // ── Render ───────────────────────────────────────────────────
    function render(data) {
        document.getElementById('title').textContent      = data.TITLE_2 || data.TITLE_1 || '—';
        document.getElementById('heat-label').textContent = 'Heat ' + (data.HEAT ?? '—') + ' / ' + (data.HEATS ?? '—');

        buildHeaders();

        const entries = (data.time_info || []).slice().sort((a, b) => {
            const pa = a.penalty > 0 ? 1 : 0;
            const pb = b.penalty > 0 ? 1 : 0;
            if (pa !== pb) return pa - pb;
            const ta = a.finishtime || Infinity;
            const tb = b.finishtime || Infinity;
            return ta - tb;
        });

        // Leader time (first non-penalty with finishtime)
        const leader = entries.find(e => !e.penalty && e.finishtime > 0);
        const leaderMs = leader ? leader.finishtime : 0;

        // Re-assign display standing
        entries.forEach((e, i) => { e.internal_standing = i + 1; });

        const container = document.getElementById('rows');
        container.innerHTML = '';
        container.style.cssText = 'display:flex;flex-direction:column;gap:2px;flex:1;';
        entries.forEach(d => container.appendChild(makeRow(d, leaderMs)));

        requestAnimationFrame(() => animateIn(container));
    }

    // ── Fetch active event results ────────────────────────────────
    fetch('/api/get_event_data?active=true')
        .then(r => r.json())
        .then(render)
        .catch(e => console.error('[resultater] feil:', e));
</script>
</body>
</html>
