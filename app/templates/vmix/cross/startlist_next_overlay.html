<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startliste – Neste</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            background: transparent;
            font-family: 'Inter', 'Arial', sans-serif;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%; height: 100%;
            position: relative;
        }

        /* ── Topptekst ── */
        #page-header {
            flex-shrink: 0;
            align-self: center;
            width: fit-content;
            min-width: 320px;
            padding: 10px 32px 8px;
            text-align: center;
            background: rgba(14, 16, 28, 0.98);
            border-radius: 8px 8px 0 0;
            position: relative;
            z-index: 2;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #page-header.show { opacity: 1; transform: translateY(0); }

        #title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            white-space: nowrap;
        }

        /* Status-merke (NESTE) */
        .status-badge {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 3px 9px;
            border-radius: 4px;
            background: rgba(64, 180, 232, 0.15);
            color: #40b4e8;
        }

        /* Modus-merke (Finale / Kvali / …) */
        .mode-badge {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 3px 9px;
            border-radius: 4px;
            background: rgba(232, 184, 64, 0.15);
            color: #e8b840;
        }
        .mode-badge.kvali {
            background: rgba(64, 180, 232, 0.15);
            color: #40b4e8;
        }
        .mode-badge.annet {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.55);
        }

        #title {
            font-size: 17px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.3px;
        }

        #heat-label {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255,255,255,0.55);
        }

        .sep {
            font-size: 14px;
            font-weight: 300;
            color: rgba(255,255,255,0.30);
            line-height: 1;
        }

        /* ── Hovedkort ── */
        #table-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 20px 16px;
            background: rgba(10, 12, 20, 0.97);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.07);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        /* ── Sporvalg-banner ── */
        #sporvalg-banner {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
            padding: 9px 14px;
            border-radius: 6px;
            opacity: 0;
            transform: translateX(-12px);
            transition: opacity 0.3s ease 0.05s, transform 0.3s ease 0.05s;
        }
        #sporvalg-banner.show { opacity: 1; transform: translateX(0); }

        #sporvalg-banner.kvali-basert {
            background: rgba(232, 184, 64, 0.07);
            border: 1px solid rgba(232, 184, 64, 0.20);
        }
        #sporvalg-banner.kvali-basert .sporvalg-ikon { color: #e8b840; }
        #sporvalg-banner.kvali-basert .sporvalg-tittel { color: #e8b840; }
        #sporvalg-banner.kvali-basert .sporvalg-tekst { color: rgba(232, 184, 64, 0.70); }

        #sporvalg-banner.tilfeldig {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.09);
        }
        #sporvalg-banner.tilfeldig .sporvalg-ikon { color: rgba(255,255,255,0.45); }
        #sporvalg-banner.tilfeldig .sporvalg-tittel { color: rgba(255,255,255,0.65); }
        #sporvalg-banner.tilfeldig .sporvalg-tekst { color: rgba(255,255,255,0.35); }

        .sporvalg-ikon { flex-shrink: 0; width: 18px; height: 18px; }
        .sporvalg-ikon svg { width: 18px; height: 18px; }
        .sporvalg-info { display: flex; align-items: baseline; gap: 8px; }
        .sporvalg-tittel { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; }
        .sporvalg-skille { font-size: 11px; font-weight: 300; opacity: 0.40; }
        .sporvalg-tekst  { font-size: 12px; font-weight: 500; }

        #bane-retning-label {
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            margin-left: auto;
        }

        /* ── Kolonneoverskrifter ── */
        #col-headers {
            display: flex;
            align-items: center;
            margin-top: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.25s ease 0.15s;
        }
        #col-headers.show { opacity: 1; }

        .ch {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.50);
            white-space: nowrap;
            overflow: hidden;
            flex-shrink: 0;
            padding: 0 16px;
            border-right: 1px solid rgba(255,255,255,0.08);
            text-align: center;
        }
        .ch.c-name { padding: 0 10px; text-align: left; }
        .ch.c-club { padding: 0 10px; text-align: left; }
        .ch:last-child { border-right: none; }

        /* ── Rader ── */
        #rows {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
            margin-top: 6px;
        }

        .row-slice {
            display: flex;
            align-items: center;
            height: 36px;
            background: transparent;
            border-left: 3px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
            opacity: 0;
            transform: translateX(-20px);
            transition: opacity 0.22s ease-out, transform 0.22s ease-out;
        }
        .row-slice.show { opacity: 1; transform: translateX(0); }
        .row-slice:nth-child(even) { background: rgba(255,255,255,0.018); }

        /* ── Kolonnebredder ── */
        .c-pos  { width: 60px;  min-width: 60px;  flex-shrink: 0; }
        .c-cid  { width: 60px;  min-width: 60px;  flex-shrink: 0; }
        .c-name { flex: 1;      min-width: 130px; }
        .c-club { width: 190px; min-width: 110px; flex-shrink: 0; }
        .c-kvali{ width: 72px;  min-width: 72px;  flex-shrink: 0; }

        /* ── Celle ── */
        .cell {
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            white-space: nowrap;
            border-right: 1px solid rgba(255,255,255,0.07);
            height: 100%;
        }
        .cell:last-child { border-right: none; }
        .cell.c-name { padding: 0 10px; justify-content: flex-start; }
        .cell.c-club { padding: 0 10px; justify-content: flex-start; }

        .pos-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px; height: 32px;
            border-radius: 5px;
            font-size: 15px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: rgba(255,255,255,0.22);
            background: rgba(255,255,255,0.04);
        }

        .val-cid   { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.80); font-variant-numeric: tabular-nums; }
        .val-name  { font-size: 15px; font-weight: 700; color: #fff; text-overflow: ellipsis; overflow: hidden; }
        .val-club  { font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.50); text-overflow: ellipsis; overflow: hidden; }
        .val-kvali { font-size: 14px; font-weight: 700; color: rgba(232, 184, 64, 0.80); font-variant-numeric: tabular-nums; }

        /* ── Tom tilstand ── */
        #tom-melding {
            display: none;
            flex: 1;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255,255,255,0.20);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
<div id="app">

    <div id="page-header">
        <div id="title-row">
            <span class="status-badge">Neste</span>
            <span class="sep">·</span>
            <span id="mode-badge" class="mode-badge">—</span>
            <span class="sep">·</span>
            <span id="title">—</span>
            <span class="sep">·</span>
            <span id="heat-label">Heat —</span>
        </div>
    </div>

    <div id="table-wrap">

        <div id="sporvalg-banner">
            <div class="sporvalg-ikon" id="sporvalg-ikon"></div>
            <div class="sporvalg-info">
                <span class="sporvalg-tittel">Sporvalg</span>
                <span class="sporvalg-skille">·</span>
                <span class="sporvalg-tekst" id="sporvalg-tekst">—</span>
            </div>
            <span id="bane-retning-label">Spor 1 til venstre</span>
        </div>

        <div id="col-headers"></div>
        <div id="rows"></div>
        <div id="tom-melding">Ingen neste startliste funnet</div>

    </div>

</div>
<script>
    const params = new URLSearchParams(window.location.search);

    // sporvalg: 'false' = skjul sporvalg-banneret
    const VIS_SPORVALG = params.get('sporvalg') !== 'false';

    (function brukParams() {
        const app   = document.getElementById('app');
        const speil = params.get('mirror') === '1' || params.get('mirror') === 'true';
        const skala = params.get('scale');
        const b = params.get('w'), h = params.get('h');
        if (b) app.style.width  = b + 'px';
        if (h) app.style.height = h + 'px';
        const opacity = params.get('opacity');
        if (opacity !== null) {
            const a = Math.min(1, Math.max(0, parseFloat(opacity)));
            document.getElementById('table-wrap').style.background = `rgba(10, 12, 20, ${a})`;
        }
        if (skala) {
            document.body.style.transformOrigin = speil ? 'top right' : 'top left';
            document.body.style.transform = 'scale(' + parseFloat(skala) + ')';
        }
    })();

    // ── SVG-ikoner ───────────────────────────────────────────────
    const SVG_POKAL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
        <path d="M4 22h16"/>
        <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
        <path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/>
    </svg>`;

    const SVG_STOKK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 3 21 3 21 8"/>
        <line x1="4" y1="20" x2="21" y2="3"/>
        <polyline points="21 16 21 21 16 21"/>
        <line x1="15" y1="15" x2="21" y2="21"/>
        <line x1="4" y1="4" x2="9" y2="9"/>
    </svg>`;

    // ── Hjelpefunksjoner ─────────────────────────────────────────
    function formaterNavn(f, l) {
        if (!f && !l) return '—';
        if (f === l) return l || '—';
        if (!l) return f;
        if (!f) return l;
        return f + ' ' + l;
    }
    function div(cls) { const el = document.createElement('div'); el.className = cls; return el; }
    function span(cls, tekst) { const el = document.createElement('span'); el.className = cls; if (tekst !== undefined) el.textContent = tekst; return el; }

    // ── DOM-bygging ───────────────────────────────────────────────
    function byggKolonneoverskrifter(visKvali) {
        const hdr = document.getElementById('col-headers');
        hdr.innerHTML = '';
        function ch(label, ekstra) {
            const el = div('ch' + (ekstra ? ' ' + ekstra : ''));
            el.textContent = label;
            hdr.appendChild(el);
        }
        ch('Spor', 'c-pos');
        ch('#', 'c-cid');
        ch('Fører', 'c-name');
        ch('Klubb', 'c-club');
        if (visKvali) ch('Kvali #', 'c-kvali');
    }

    function byggRad(innslag, idx, visKvali) {
        const rad = div('row-slice');
        const posCell = div('cell c-pos');
        const brikke  = div('pos-badge');
        brikke.textContent = idx + 1;
        posCell.appendChild(brikke);
        rad.appendChild(posCell);

        const cidCell = div('cell c-cid');
        cidCell.appendChild(span('val-cid', innslag.cid ?? ''));
        rad.appendChild(cidCell);

        const navnCell = div('cell c-name');
        navnCell.appendChild(span('val-name', formaterNavn(innslag.first_name, innslag.last_name)));
        rad.appendChild(navnCell);

        const klubbCell = div('cell c-club');
        klubbCell.appendChild(span('val-club', innslag.club || ''));
        rad.appendChild(klubbCell);

        if (visKvali) {
            const kvaliCell = div('cell c-kvali');
            kvaliCell.appendChild(span('val-kvali', innslag.qualifying_standing ?? ''));
            rad.appendChild(kvaliCell);
        }
        return rad;
    }

    // ── Animasjon ─────────────────────────────────────────────────
    function animerInn() {
        document.getElementById('page-header').classList.add('show');
        if (VIS_SPORVALG) document.getElementById('sporvalg-banner').classList.add('show');
        setTimeout(() => document.getElementById('col-headers').classList.add('show'), 120);
        document.querySelectorAll('#rows .row-slice')
            .forEach((el, i) => setTimeout(() => el.classList.add('show'), 200 + i * 45));
    }

    function animerUt(cb) {
        document.getElementById('page-header').classList.remove('show');
        if (VIS_SPORVALG) document.getElementById('sporvalg-banner').classList.remove('show');
        document.getElementById('col-headers').classList.remove('show');
        document.querySelectorAll('#rows .row-slice').forEach(el => el.classList.remove('show'));
        setTimeout(cb, 320);
    }

    // ── Vis innhold ───────────────────────────────────────────────
    function render(data) {
        const innslag       = data.entries || [];
        const modus         = (data.mode || 'other').toLowerCase();
        const hendelsesNavn = data.event || '—';
        const heat          = data.heat;
        const erKvaliBasert = data.track_placement === 'best_from_kvali';

        const modeBadge = document.getElementById('mode-badge');
        modeBadge.className = 'mode-badge';
        if (modus === 'kvali') { modeBadge.classList.add('kvali'); modeBadge.textContent = 'Kvali'; }
        else if (modus === 'finale') { modeBadge.textContent = 'Finale'; }
        else { modeBadge.classList.add('annet'); modeBadge.textContent = modus.charAt(0).toUpperCase() + modus.slice(1); }

        document.getElementById('title').textContent      = hendelsesNavn;
        document.getElementById('heat-label').textContent = 'Heat ' + heat;

        if (VIS_SPORVALG) {
            const banner = document.getElementById('sporvalg-banner');
            const ikon   = document.getElementById('sporvalg-ikon');
            const tekst  = document.getElementById('sporvalg-tekst');
            banner.className = '';
            if (erKvaliBasert) {
                banner.id = 'sporvalg-banner'; banner.classList.add('kvali-basert');
                ikon.innerHTML = SVG_POKAL;
                tekst.textContent = 'Beste kvali-resultat velger spor';
            } else {
                banner.id = 'sporvalg-banner'; banner.classList.add('tilfeldig');
                ikon.innerHTML = SVG_STOKK;
                tekst.textContent = 'Tilfeldig trekning';
            }
        }

        byggKolonneoverskrifter(erKvaliBasert);

        const container  = document.getElementById('rows');
        container.innerHTML = '';
        const tomMelding = document.getElementById('tom-melding');
        if (innslag.length === 0) {
            tomMelding.style.display = 'flex';
        } else {
            tomMelding.style.display = 'none';
            innslag.forEach((entry, i) => container.appendChild(byggRad(entry, i, erKvaliBasert)));
        }
        requestAnimationFrame(animerInn);
    }

    // ── Last neste startliste ─────────────────────────────────────
    let visestNå = null; // "event_name|heat" for å unngå unødvendig oppdatering

    function last() {
        fetch('http://192.168.1.50:7777/api/get_active_events')
            .then(r => r.json())
            .then(hendelser => {
                hendelser.sort((a, b) => a.sort_order - b.sort_order);
                const aktivIdx = hendelser.findIndex(e => e.active);
                if (aktivIdx === -1) {
                    document.getElementById('tom-melding').style.display = 'flex';
                    return;
                }
                // Første uavsluttede rad etter den aktive
                const neste = hendelser.slice(aktivIdx + 1).find(e => !e.finished);
                if (!neste) {
                    document.getElementById('tom-melding').style.display = 'flex';
                    return;
                }
                const nøkkel = `${neste.event_name}|${neste.run}`;
                if (nøkkel === visestNå) return; // ingen endring, ikke oppdater
                visestNå = nøkkel;
                return fetch(`http://192.168.1.50:7777/api/get_startlist?event_name=${encodeURIComponent(neste.event_name)}&heat=${neste.run}`)
                    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
            })
            .then(data => { if (data) { animerUt(() => render(data)); } })
            .catch(e => console.error('[neste-startliste] feil:', e));
    }

    last();
    setInterval(last, 15000);
</script>
</body>
</html>
