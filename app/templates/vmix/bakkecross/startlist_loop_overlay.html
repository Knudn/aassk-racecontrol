<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startliste – Løkke</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            background: transparent;
            font-family: 'Inter', 'Arial', sans-serif;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%; height: 100%;
            position: relative;
        }

        /* ── Topptekst ── */
        #page-header {
            flex-shrink: 0;
            align-self: center;
            width: fit-content;
            min-width: 320px;
            padding: 10px 32px 8px;
            text-align: center;
            background: rgba(14, 16, 28, 0.98);
            border-radius: 8px 8px 0 0;
            position: relative;
            z-index: 2;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #page-header.show { opacity: 1; transform: translateY(0); }

        #title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            white-space: nowrap;
        }

        .mode-badge {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 3px 9px;
            border-radius: 4px;
            background: rgba(232, 184, 64, 0.15);
            color: #e8b840;
        }
        .mode-badge.annet {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.55);
        }

        #title {
            font-size: 17px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.3px;
        }

        #heat-label {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255,255,255,0.55);
        }

        .sep {
            font-size: 14px;
            font-weight: 300;
            color: rgba(255,255,255,0.30);
            line-height: 1;
        }

        #teller-label {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255,255,255,0.35);
            font-variant-numeric: tabular-nums;
        }

        /* ── Framdriftslinje ── */
        #progress-wrap {
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.08);
            border-radius: 1px;
            margin-top: 8px;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: rgba(255,255,255,0.45);
            border-radius: 1px;
        }

        /* ── Hovedkort ── */
        #table-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 20px 16px;
            background: rgba(10, 12, 20, 0.97);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.07);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        /* ── Kolonneoverskrifter ── */
        #col-headers {
            display: flex;
            align-items: center;
            margin-top: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.25s ease 0.15s;
        }
        #col-headers.show { opacity: 1; }

        .ch {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.50);
            white-space: nowrap;
            overflow: hidden;
            flex-shrink: 0;
            padding: 0 16px;
            border-right: 1px solid rgba(255,255,255,0.08);
            text-align: center;
        }
        .ch.c-name { padding: 0 14px; text-align: left; }
        .ch.c-club { padding: 0 14px; text-align: left; }
        .ch:last-child { border-right: none; }

        /* ── Rader ── */
        #rows {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
            margin-top: 6px;
        }

        .row-slice {
            display: flex;
            align-items: center;
            height: 58px;
            background: transparent;
            border-left: 4px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
            opacity: 0;
            transform: translateX(-20px);
            transition: opacity 0.22s ease-out, transform 0.22s ease-out;
        }
        .row-slice.show { opacity: 1; transform: translateX(0); }
        .row-slice:nth-child(even) { background: rgba(255,255,255,0.018); }

        /* ── Kolonnebredder ── */
        .c-pos  { width: 72px;  min-width: 72px;  flex-shrink: 0; }
        .c-cid  { width: 72px;  min-width: 72px;  flex-shrink: 0; }
        .c-name { flex: 1;      min-width: 130px; }
        .c-club { width: 220px; min-width: 120px; flex-shrink: 0; }

        /* ── Celle ── */
        .cell {
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            white-space: nowrap;
            border-right: 1px solid rgba(255,255,255,0.07);
            height: 100%;
        }
        .cell:last-child { border-right: none; }
        .cell.c-name { padding: 0 14px; justify-content: flex-start; }
        .cell.c-club { padding: 0 14px; justify-content: flex-start; }

        .pos-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px; height: 42px;
            border-radius: 7px;
            font-size: 22px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: rgba(255,255,255,0.22);
            background: rgba(255,255,255,0.04);
        }

        .val-cid   { font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.80); font-variant-numeric: tabular-nums; }
        .val-name  { font-size: 22px; font-weight: 700; color: #fff; text-overflow: ellipsis; overflow: hidden; }
        .val-club  { font-size: 17px; font-weight: 500; color: rgba(255,255,255,0.50); text-overflow: ellipsis; overflow: hidden; }

        /* ── Tom tilstand ── */
        #tom-melding {
            display: none;
            flex: 1;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255,255,255,0.20);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
<div id="app">

    <div id="page-header">
        <div id="title-row">
            <span id="mode-badge" class="mode-badge">—</span>
            <span class="sep">·</span>
            <span id="title">—</span>
            <span class="sep">·</span>
            <span id="heat-label">Heat —</span>
            <span class="sep">·</span>
            <span id="teller-label">— / —</span>
        </div>
        <div id="progress-wrap">
            <div id="progress-bar"></div>
        </div>
    </div>

    <div id="table-wrap">
        <div id="col-headers">
            <div class="ch c-pos">Start</div>
            <div class="ch c-cid">#</div>
            <div class="ch c-name">Fører</div>
            <div class="ch c-club">Klubb</div>
        </div>
        <div id="rows"></div>
        <div id="tom-melding">Ingen startliste funnet</div>
    </div>

</div>
<script>
    // ── URL-parametere ───────────────────────────────────────────
    const params       = new URLSearchParams(window.location.search);
    const TIMER_SEK    = Math.max(3, parseInt(params.get('timer') || '10'));

    // filter: delstreng på hendelsesnavn, f.eks. "finale", "heat 1"
    const FILTER       = (params.get('filter') || '').toLowerCase().trim();

    // finished: 'false' = vis kun uavsluttede, 'true' = kun avsluttede, 'all' = alle
    const FERDIG_PARAM = (params.get('finished') || 'false').toLowerCase().trim();

    // heat: 'next' = neste uavsluttede, eller et spesifikt tall
    const HEAT_PARAM   = (params.get('heat') || 'next').toLowerCase().trim();

    (function brukParams() {
        const app   = document.getElementById('app');
        const speil = params.get('mirror') === '1' || params.get('mirror') === 'true';
        const skala = params.get('scale');
        const b = params.get('w'), h = params.get('h');
        if (b) app.style.width  = b + 'px';
        if (h) app.style.height = h + 'px';
        const opacity = params.get('opacity');
        if (opacity !== null) {
            const a = Math.min(1, Math.max(0, parseFloat(opacity)));
            document.getElementById('table-wrap').style.background = `rgba(10, 12, 20, ${a})`;
        }
        if (skala) {
            document.body.style.transformOrigin = speil ? 'top right' : 'top left';
            document.body.style.transform = 'scale(' + parseFloat(skala) + ')';
        }
    })();

    // ── Hjelpefunksjoner ─────────────────────────────────────────
    function formaterNavn(f, l) {
        if (!f && !l) return '—';
        if (f === l) return l || '—';
        if (!l) return f;
        if (!f) return l;
        return f + ' ' + l;
    }
    function div(cls) { const el = document.createElement('div'); el.className = cls; return el; }
    function span(cls, tekst) { const el = document.createElement('span'); el.className = cls; if (tekst !== undefined) el.textContent = tekst; return el; }

    // ── Bygg program fra aktive hendelser ────────────────────────
    function byggProgram(alleHendelser) {
        let filtrert = alleHendelser;

        // Filtrer på ferdig-status
        if (FERDIG_PARAM === 'false') {
            filtrert = filtrert.filter(e => !e.finished);
        } else if (FERDIG_PARAM === 'true') {
            filtrert = filtrert.filter(e => !!e.finished);
        }

        // Filtrer på hendelsesnavn
        if (FILTER) {
            filtrert = filtrert.filter(e =>
                e.event_name.toLowerCase().includes(FILTER)
            );
        }

        filtrert.sort((a, b) => a.sort_order - b.sort_order);

        // Grupper etter event_name
        const grupper    = {};
        const rekkefølge = [];
        filtrert.forEach(rad => {
            if (!grupper[rad.event_name]) {
                grupper[rad.event_name] = [];
                rekkefølge.push(rad.event_name);
            }
            grupper[rad.event_name].push(rad);
        });

        const heatTall        = parseInt(HEAT_PARAM);
        const erSpesifiktHeat = !isNaN(heatTall) && HEAT_PARAM !== 'next';

        const program = [];
        rekkefølge.forEach(navn => {
            const rader = grupper[navn].slice().sort((a, b) => a.run - b.run);
            if (erSpesifiktHeat) {
                const rad = rader.find(r => r.run == heatTall);
                if (rad) program.push({ event_name: navn, heat: heatTall });
            } else {
                if (rader.length > 0) {
                    program.push({ event_name: navn, heat: rader[0].run });
                }
            }
        });

        return program;
    }

    // ── DOM-bygging ───────────────────────────────────────────────
    function byggRad(innslag, idx) {
        const rad = div('row-slice');

        const posCell = div('cell c-pos');
        const brikke  = div('pos-badge');
        brikke.textContent = idx + 1;
        posCell.appendChild(brikke);
        rad.appendChild(posCell);

        const cidCell = div('cell c-cid');
        cidCell.appendChild(span('val-cid', innslag.cid ?? ''));
        rad.appendChild(cidCell);

        const navnCell = div('cell c-name');
        navnCell.appendChild(span('val-name', formaterNavn(innslag.first_name, innslag.last_name)));
        rad.appendChild(navnCell);

        const klubbCell = div('cell c-club');
        klubbCell.appendChild(span('val-club', innslag.club || ''));
        rad.appendChild(klubbCell);

        return rad;
    }

    // ── Animasjon ─────────────────────────────────────────────────
    function animerInn() {
        document.getElementById('page-header').classList.add('show');
        setTimeout(() => document.getElementById('col-headers').classList.add('show'), 120);
        const rader = document.querySelectorAll('#rows .row-slice');
        rader.forEach((el, i) => setTimeout(() => el.classList.add('show'), 200 + i * 45));
    }

    function animerUt(cb) {
        document.getElementById('page-header').classList.remove('show');
        document.getElementById('col-headers').classList.remove('show');
        document.querySelectorAll('#rows .row-slice').forEach(el => el.classList.remove('show'));
        setTimeout(cb, 350);
    }

    // ── Framdriftslinje ───────────────────────────────────────────
    function startFramdrift() {
        const bar = document.getElementById('progress-bar');
        bar.style.transition = 'none';
        bar.style.width = '0%';
        requestAnimationFrame(() => requestAnimationFrame(() => {
            bar.style.transition = `width ${TIMER_SEK}s linear`;
            bar.style.width = '100%';
        }));
    }

    function nullstillFramdrift() {
        const bar = document.getElementById('progress-bar');
        bar.style.transition = 'none';
        bar.style.width = '0%';
    }

    // ── Vis innhold ───────────────────────────────────────────────
    function render(data) {
        const innslag       = data.entries || [];
        const modus         = (data.mode || 'other').toLowerCase();
        const hendelsesNavn = data.event || '—';
        const heat          = data.heat;

        const modeBadge = document.getElementById('mode-badge');
        modeBadge.className = 'mode-badge';
        if (modus === 'finale') {
            modeBadge.textContent = 'Finale';
        } else {
            modeBadge.classList.add('annet');
            modeBadge.textContent = modus.charAt(0).toUpperCase() + modus.slice(1);
        }

        document.getElementById('title').textContent      = hendelsesNavn;
        document.getElementById('heat-label').textContent = 'Heat ' + heat;

        const container  = document.getElementById('rows');
        container.innerHTML = '';
        const tomMelding = document.getElementById('tom-melding');

        if (innslag.length === 0) {
            tomMelding.style.display = 'flex';
        } else {
            tomMelding.style.display = 'none';
            innslag.forEach((entry, i) => container.appendChild(byggRad(entry, i)));
        }

        requestAnimationFrame(animerInn);
    }

    // ── Løkke-tilstand ────────────────────────────────────────────
    let program    = [];
    let løkkeIdx   = 0;
    let slideTimer = null;

    function oppdaterTeller() {
        document.getElementById('teller-label').textContent =
            program.length > 0 ? `${løkkeIdx + 1} / ${program.length}` : '— / —';
    }

    function visOgPlanlegg() {
        const { event_name, heat } = program[løkkeIdx];
        const url = `/api/get_startlist?event_name=${encodeURIComponent(event_name)}&heat=${heat}`;

        fetch(url)
            .then(r => {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(data => {
                render(data);
                oppdaterTeller();
                startFramdrift();
            })
            .catch(e => console.error('[startliste-løkke] feil ved lasting:', e));

        clearTimeout(slideTimer);
        slideTimer = setTimeout(() => {
            animerUt(() => {
                nullstillFramdrift();
                løkkeIdx = (løkkeIdx + 1) % program.length;
                visOgPlanlegg();
            });
        }, TIMER_SEK * 1000);
    }

    // ── Initialisering ────────────────────────────────────────────
    function lastHendelsesliste() {
        fetch('/api/get_active_events')
            .then(r => r.json())
            .then(data => {
                program = byggProgram(data);

                if (program.length === 0) {
                    console.warn('[startliste-løkke] ingen hendelser matcher filtrene');
                    document.getElementById('tom-melding').style.display = 'flex';
                    return;
                }

                løkkeIdx = 0;
                visOgPlanlegg();
            })
            .catch(e => console.error('[startliste-løkke] feil ved lasting av hendelser:', e));
    }

    lastHendelsesliste();
    setInterval(() => {
        if (program.length > 0) return;
        lastHendelsesliste();
    }, 30000);
</script>
</body>
</html>
