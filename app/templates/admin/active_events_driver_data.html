{% extends 'admin/layout.html' %}
{% block content %}
<style>
    .center-div {
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Arial', sans-serif;
    }
    h2 {
        color: #333;
        font-size: 2em;
        text-align: center;
    }
    #column-checkboxes {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px 0;
    }
    #column-checkboxes label {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.85rem;
        user-select: none;
    }
    #column-checkboxes label.extra-field {
        background-color: #fff8e1;
        border-color: #ffc107;
    }
    #col-vis-toggle {
        cursor: pointer;
    }
</style>

<link href="https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>

<div class="center-div">
    {% if returned_event_info == "None" %}
        <h2>Pick the Event</h2>
    {% else %}
        <h2>{{ returned_event_info }}</h2>
    {% endif %}
</div>

<form id="eventForm" method="POST" action="{{ url_for('admin.admin', tab_name='active_events_driver_data') }}">
    <select id="eventDropdown" class="form-select form-select-lg mb-3" name="event_name">
        <option selected>Open this select menu</option>
        {% for event in unique_events %}
            <option value="{{ event[0] }}" data-max-heat="{{ event[1] }}">{{ event[0] }}</option>
        {% endfor %}
    </select>

    <select id="runDropdown" class="form-select form-select-sm" name="run">
        <option selected>Open this select menu</option>
    </select>

    <input type="hidden" name="event_file" id="eventFileInput" value="">

    <div class="d-grid gap-2">
        <button class="btn btn-primary" type="submit">Select</button>
        <button class="btn btn-secondary" type="button" id="activeEventsBtn">Active Event</button>
    </div>
</form>

<script>
    document.getElementById('activeEventsBtn').addEventListener('click', function() {
        document.getElementById('eventFileInput').value = "active_event";
        document.getElementById('eventForm').submit();
    });
</script>

<br>

{% if sqldata != "None" %}
<div class="mb-2">
    <button class="btn btn-sm btn-outline-secondary" id="col-vis-toggle" type="button">&#9654; Column Visibility</button>
    <div id="col-vis-panel" style="display:none; border:1px solid #dee2e6; border-radius:4px; padding:8px; margin-top:4px;">
        <small class="text-muted">JSON fields</small>
        <div id="column-checkboxes"></div>
        <small class="text-muted" style="color:#856404 !important;">&#9656; Highlighted = database fields (outside JSON data)</small>
    </div>
</div>
{% endif %}

<div id="driver-stats-table"></div>
<br>

<button id="updateData" class="btn btn-secondary">Update</button>
<button id="refresh_data" class="btn btn-secondary">Reload Event</button>

<script>
    var table;
    var STORAGE_KEY = "col_vis__active_events_driver_data";

    var extraKeys  = {{ extra_keys | safe  }};
    var dynamicKeys = {{ dynamic_keys | safe }};

    function saveVisibility(state) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadVisibility() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
        catch(e) { return {}; }
    }

    document.addEventListener("DOMContentLoaded", function() {
        // Column toggle panel
        var toggleBtn = document.getElementById("col-vis-toggle");
        var panel = document.getElementById("col-vis-panel");
        if (toggleBtn) {
            toggleBtn.addEventListener("click", function() {
                var open = panel.style.display !== "none";
                panel.style.display = open ? "none" : "block";
                toggleBtn.textContent = (open ? "\u25BA" : "\u25BC") + " Column Visibility";
            });
        }

        // Build ordered list of all columns: CID | extra | dynamic | LOCKED
        var allCols = [];
        allCols.push({field: "CID", title: "CID", isExtra: false});
        extraKeys.forEach(function(k) {
            allCols.push({field: k, title: k, isExtra: true});
        });
        dynamicKeys.forEach(function(k) {
            allCols.push({field: k, title: k, isExtra: false});
        });
        allCols.push({field: "LOCKED", title: "Locked", isExtra: false});

        var savedVis = loadVisibility();

        // Build Tabulator column defs
        var columns = allCols.map(function(col) {
            var defaultVis = !col.isExtra;
            var visible = (col.field in savedVis) ? savedVis[col.field] : defaultVis;
            var def = {title: col.title, field: col.field, visible: visible};
            if (col.field === "LOCKED") {
                def.width = 90;
                def.hozAlign = "center";
                def.formatter = "tickCross";
                def.sorter = "boolean";
                def.editor = true;
            } else if (col.field !== "CID" && !col.isExtra) {
                def.editor = "input";
            }
            return def;
        });
        var tableData = {% if sqldata != "None" %}{{ sqldata|safe }}{% else %}[]{% endif %};
        table = new Tabulator("#driver-stats-table", {
            data: tableData,
            layout: "fitColumns",
            columns: columns,
        });

        // Build checkboxes
        var cbContainer = document.getElementById("column-checkboxes");
        if (cbContainer) {
            allCols.forEach(function(col) {
                var defaultVis = !col.isExtra;
                var visible = (col.field in savedVis) ? savedVis[col.field] : defaultVis;

                var label = document.createElement("label");
                if (col.isExtra) label.classList.add("extra-field");

                var cb = document.createElement("input");
                cb.type = "checkbox";
                cb.id = "cb_" + col.field;
                cb.checked = visible;
                cb.addEventListener("change", function() {
                    if (this.checked) {
                        table.showColumn(col.field);
                    } else {
                        table.hideColumn(col.field);
                    }
                    table.redraw(true);
                    // Persist current state
                    var state = {};
                    allCols.forEach(function(c) {
                        var el = document.getElementById("cb_" + c.field);
                        if (el) state[c.field] = el.checked;
                    });
                    saveVisibility(state);
                });

                label.appendChild(cb);
                label.appendChild(document.createTextNode("\u00a0" + col.title));
                cbContainer.appendChild(label);
            });
        }

        document.getElementById("updateData").addEventListener("click", function() {
            if (!table) return;
            var tableData = table.getData();
            var combinedData = {
                data: tableData,
                title_2: "{{ event_entry_file.title_2 if event_entry_file != 'None' else '' }}",
                heat: "{{ event_entry_file.heat if event_entry_file != 'None' else '' }}"
            };
            fetch("{{ url_for('admin.admin', tab_name='active_events_driver_data') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(combinedData)
            }).then(response => response.json())
              .then(data => console.log(data));
        });

        document.getElementById("refresh_data").addEventListener("click", function() {
            if (!table) return;
            var jsonData = {
                title_2: "{{ event_entry_file.title_2 if event_entry_file != 'None' else '' }}",
                heat: "{{ event_entry_file.heat if event_entry_file != 'None' else '' }}"
            };
            fetch("/api/reload_event", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(jsonData),
            }).then(response => response.json())
              .then(data => console.log(data));
        });
    });

    const eventDropdown = document.getElementById('eventDropdown');
    const runDropdown = document.getElementById('runDropdown');

    eventDropdown.addEventListener('change', function() {
        const selectedOption = this.options[this.selectedIndex];
        const maxHeat = parseInt(selectedOption.getAttribute('data-max-heat'));
        runDropdown.innerHTML = '';
        for (let i = 1; i <= maxHeat; i++) {
            const option = document.createElement('option');
            option.value = i;
            option.text = "Heat " + i;
            runDropdown.add(option);
        }
    });

</script>

{% endblock %}
