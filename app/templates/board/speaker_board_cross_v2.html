<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Løpsinformasjon - Cross</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="{{url_for('static', filename='js/socket.io.js')}}"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');

        :root {
            --primary-color: #2c3e50;
            --background-color: #ecf0f1;
            --text-color: #34495e;
            --border-color: #bdc3c7;
        }
        #top_driver_bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            font-size: 14px;
            line-height: 1.3;
        }
        .info-cell-id {
            max-width: 50px;
        }
        .container { width: 100%; padding: 10px; }
        .title-container {
            text-align: center;
            margin-bottom: 6px;
            padding: 8px 10px;
            background-color: var(--primary-color);
            color: white;
        }
        h1 { font-size: 1.5em; font-weight: 700; }
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .nav-controls select { flex: 1; padding: 2px 6px; font-size: 0.85em; }
        .nav-controls .btn { min-width: 36px; padding: 2px 8px; font-size: 0.85em; }
        .info-section {
            background-color: white;
            width: 100%;
            margin-bottom: 10px;
        }

        .info-cell-time {
            max-width: 120px;
        }
        .info-header {
            background-color: var(--primary-color);
            color: white;
            padding: 4px 0;
            font-weight: bold;
            font-size: 0.85em;
            display: flex;
        }
        .info-body {
            border: 1px solid var(--border-color);
            border-top: none;
        }
        .info-row {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }
        .info-row:last-child { border-bottom: none; }
        .info-cell {
            flex: 1;
            padding: 3px 6px;
            text-align: center;
        }
        .info-cell-pos {
            flex: 0.5;
            padding: 3px 6px;
            text-align: center;
        }
        .info-cell-name {
            flex: 2;
            padding: 3px 6px;
            text-align: left;
        }
        .info-cell i { margin-right: 3px; color: var(--primary-color); }
        .info-header .info-cell i,
        .info-header .info-cell-pos i,
        .info-header .info-cell-name i { color: white; }
        .section-title {
            background-color: #34495e;
            color: white;
            padding: 4px 10px;
            font-size: 0.9em;
            font-weight: bold;
        }
        .class-separator {
            display: flex;
            align-items: center;
            padding: 3px 10px;
            background-color: #f0f0f0;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            color: #555;
            font-size: 0.8em;
        }
        .class-separator::before,
        .class-separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #aaa;
        }
        .class-separator::before { margin-right: 8px; }
        .class-separator::after { margin-left: 8px; }
        .finished-driver { background-color: #e8f5e9; }
        .penalty-driver { background-color: #ffebee; }
        .race-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 12px;
            font-size: 0.85em;
            font-weight: 700;
            color: #fff;
            background: #555;
            margin-bottom: 0;
        }
        .race-banner .flag-dot {
            width: 14px; height: 14px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            vertical-align: middle;
            border: 1px solid rgba(255,255,255,0.4);
        }
        .race-banner .countdown {
            font-size: 1.15em;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
        }
        @media (max-width: 768px) {
            .info-header, .info-row { flex-direction: column; }
            .info-cell, .info-cell-pos, .info-cell-name {
                padding: 3px 6px;
                border-bottom: 1px solid var(--border-color);
            }
            .info-cell:last-child { border-bottom: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-container">
            <h1 id="title1">Laster...</h1>
        </div>

        <div class="alert alert-warning" role="alert" style="padding:3px 8px; margin-bottom:6px; font-size: 13px;" id="top_driver_bar">
            <span id="heatLeader"><strong>Heat:</strong> --</span>
            <span id="eventLeader"><strong>Event:</strong> --</span>
            <span id="dayLeader"><strong>Day:</strong> --</span>
        </div>

        <!-- Navigation for active heat table -->
        <div class="nav-controls">
            <button class="btn btn-secondary" id="btnPrevHeat"><i class="fas fa-arrow-left"></i></button>
            <span id="heatNavLabel" style="flex:1; text-align:center; align-self:center; font-weight:bold; font-size:0.85em;">Aktivt heat</span>
            <button class="btn btn-secondary" id="btnNextHeat"><i class="fas fa-arrow-right"></i></button>
        </div>

        <!-- Top table: Active event + heat results -->
        <div class="info-section">
            <div class="race-banner" id="raceBanner" style="display:none;">
                <span><span class="flag-dot" id="flagDot"></span><span id="flagLabel">--</span></span>
                <span class="countdown" id="countdownDisplay">--</span>
            </div>
            <div class="section-title" id="heatTableTitle">Heat Resultater</div>
            <div id="activeHeatContent"></div>
        </div>

        <!-- Navigation for aggregated table -->
        <div class="nav-controls">
            <button class="btn btn-secondary" id="btnPrevEvent"><i class="fas fa-arrow-left"></i></button>
            <select id="eventDropdown" class="form-select" aria-label="Velg løp">
                <option selected value="">Aktivt løp</option>
            </select>
            <button class="btn btn-secondary" id="btnNextEvent"><i class="fas fa-arrow-right"></i></button>
        </div>

        <!-- Bottom table: Aggregated event results -->
        <div class="info-section">
            <div class="section-title" id="aggregatedTableTitle">Sammenlagt</div>
            <div id="aggregatedContent"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script>
        let old_results = '';
        let allEventsData = [];
        let activeEventData = null;
        let standingConfig = { scoring_method: 'best_lap', use_points: false, mix_classes: false };
        let heatBrowseIndex = null; // null = showing active event (default)
        let raceState = { man_ready: false, ready: false, started: false, halt_race: false, warmup: false, running: false };
        let prevRaceState = {};
        let countdownInterval = null;

        // Timer state — set once when race starts, frozen until next race
        let timerLocked = false;      // true = we captured the epochs, don't recalculate
        let timerStartEpoch = 0;      // epoch when race started
        let timerFinishEpoch = 0;     // epoch when timer runs out
        let timerTotalSec = 0;        // total duration in seconds (for display)
        let timerLapsToGo = 0;        // laps remaining (from driver data)
        let timerHalted = false;      // currently paused by halt
        let timerHaltedAt = 0;        // epoch when halt began
        let timerAllFinished = false; // all drivers finished

        // --- Race status banner ---
        function updateRaceBanner() {
            let banner = document.getElementById('raceBanner');
            if (heatBrowseIndex !== null) {
                banner.style.display = 'none';
                return;
            }
            banner.style.display = 'flex';
            updateFlagIndicator();
            updateCountdown();
        }

        function updateFlagIndicator() {
            let dot = document.getElementById('flagDot');
            let label = document.getElementById('flagLabel');
            let banner = document.getElementById('raceBanner');
            let s = raceState;

            let color, text, bg;
            if (s.halt_race) {
                color = '#e74c3c'; text = 'Rodt flagg'; bg = '#c0392b';
            } else if (s.warmup) {
                color = '#9b59b6'; text = 'Oppvarming'; bg = '#7d3c98';
            } else if (s.running || s.started) {
                color = '#2ecc71'; text = 'Grønt'; bg = '#27ae60';
            } else if (s.man_ready && s.ready) {
                color = '#f1c40f'; text = 'Klar'; bg = '#d4a017';
            } else if (s.man_ready || s.ready) {
                color = '#e67e22'; text = 'Venter'; bg = '#555';
            } else {
                color = '#888'; text = 'Inaktiv'; bg = '#555';
            }
            dot.style.background = color;
            label.textContent = text;
            banner.style.background = bg;
        }

        function onRaceStateChanged(newState) {
            let prev = prevRaceState;
            let wasHalted = prev.halt_race;
            let isHalted = newState.halt_race;
            let wasStarted = prev.started || prev.running;
            let isStarted = newState.started || newState.running;

            prevRaceState = Object.assign({}, newState);
            raceState = newState;

            // Race just started — lock the timer from the epoch values
            if (!wasStarted && isStarted && !timerLocked) {
                lockTimer();
            }

            // Halt just triggered — pause the timer
            if (!wasHalted && isHalted && !timerHalted) {
                timerHalted = true;
                timerHaltedAt = Math.floor(Date.now() / 1000);
            }

            // Halt just removed — resync by shifting finish epoch forward
            if (wasHalted && !isHalted && timerHalted) {
                let pausedFor = Math.floor(Date.now() / 1000) - timerHaltedAt;
                timerFinishEpoch += pausedFor;
                timerHalted = false;
                timerHaltedAt = 0;
            }

            // Race no longer active at all — reset for next race
            if (!newState.started && !newState.running && !newState.man_ready && !newState.ready && !newState.warmup && !newState.halt_race) {
                resetTimer();
            }

            if (heatBrowseIndex === null) updateFlagIndicator();
        }

        function lockTimer() {
            if (timerLocked) return;
            if (timerStartEpoch === 0 || timerFinishEpoch === 0) return;
            timerTotalSec = timerFinishEpoch - timerStartEpoch;
            timerLocked = true;
        }

        function resetTimer() {
            timerLocked = false;
            timerStartEpoch = 0;
            timerFinishEpoch = 0;
            timerTotalSec = 0;
            timerLapsToGo = 0;
            timerHalted = false;
            timerHaltedAt = 0;
            timerAllFinished = false;
        }

        function parseTimedataFromDrivers(data) {
            let drivers = data.time_info || [];
            if (drivers.length === 0) return;
            let d = drivers[0];

            // Parse epoch values from timedata "start:finish:secondsLeft"
            let td = d.timedata || '';
            let parts = td.split(':');
            if (parts.length >= 3 && !timerLocked) {
                let s = parseInt(parts[0]) || 0;
                let f = parseInt(parts[1]) || 0;
                if (s > 0 && f > 0) {
                    timerStartEpoch = s;
                    timerFinishEpoch = f;
                }
            }

            // Always update laps_to_go from latest data
            timerLapsToGo = parseInt(d.laps_to_go) || 0;

            // Check if all drivers are finished
            if (drivers.length > 0) {
                timerAllFinished = drivers.every(dr =>
                    dr.finished === true || dr.finished === "true"
                );
            }
        }

        function formatMMSS(sec) {
            if (sec < 0) sec = 0;
            let m = Math.floor(sec / 60);
            let s = sec % 60;
            return m + ':' + String(s).padStart(2, '0');
        }

        function updateCountdown() {
            let el = document.getElementById('countdownDisplay');

            // Not locked yet — race hasn't started
            if (!timerLocked) {
                el.textContent = '--:-- / --:--';
                return;
            }

            // All drivers finished
            if (timerAllFinished) {
                el.textContent = 'Ferdig';
                return;
            }

            // Laps to go takes precedence — time is up, show laps
            if (timerLapsToGo > 0) {
                let lapsText = timerLapsToGo === 1 ? 'Siste runde' : timerLapsToGo + ' runder igjen';
                el.textContent = '0:00 / ' + formatMMSS(timerTotalSec) + '  ' + lapsText;
                return;
            }

            // Calculate remaining time
            let now = Math.floor(Date.now() / 1000);
            if (timerHalted) now = timerHaltedAt; // freeze at halt moment

            let remaining = timerFinishEpoch - now;
            if (remaining < 0) remaining = 0;

            el.textContent = formatMMSS(remaining) + ' / ' + formatMMSS(timerTotalSec);
        }

        function startCountdownTicker() {
            if (countdownInterval) return;
            countdownInterval = setInterval(function() {
                if (heatBrowseIndex === null) updateCountdown();
            }, 1000);
        }

        // --- MD5 hash function ---

35309556),r=md5_hh(r,i=md5_hh(i,m=md5_hh(m,f,r,i,d[n+1],4,-1530992060),f,r,d[n+4],11,1272893353),m,f,d[n+7],16,-155497632),i,m,d[n+10],23,-1094730640),r=md5_hh(r,i=md5_hh(i,m=md5_hh(m,f,r,i,d[n+13],4,681279174),f,r,d[n+0],11,-358537222),m,f,d[n+3],16,-722521979),i,m,d[n+6],23,76029189),r=md5_hh(r,i=md5_hh(i,m=md5_hh(m,f,r,i,d[n+9],4,-640364487),f,r,d[n+12],11,-421815835),m,f,d[n+15],16,530742520),i,m,d[n+2],23,-995338651),r=md5_ii(r,i=md5_ii(i,m=md5_ii(m,f,r,i,d[n+0],6,-198630844),f,r,d[n+7],10,1126891415),m,f,d[n+14],15,-1416354905),i,m,d[n+5],21,-57434055),r=md5_ii(r,i=md5_ii(i,m=md5_ii(m,f,r,i,d[n+12],6,1700485571),f,r,d[n+3],10,-1894986606),m,f,d[n+10],15,-1051523),i,m,d[n+1],21,-2054922799),r=md5_ii(r,i=md5_ii(i,m=md5_ii(m,f,r,i,d[n+8],6,1873313359),f,r,d[n+15],10,-30611744),m,f,d[n+6],15,-1560198380),i,m,d[n+13],21,1309151649),r=md5_ii(r,i=md5_ii(i,m=md5_ii(m,f,r,i,d[n+4],6,-145523070),f,r,d[n+11],10,-1120210379),m,f,d[n+2],15,718787259),i,m,d[n+9],21,-343485551),m=safe_add(m,h),f=safe_add(f,t),r=safe_add(r,g),i=safe_add(i,e)}return Array(m,f,r,i)}function md5_cmn(d,_,m,f,r,i){return safe_add(bit_rol(safe_add(safe_add(_,d),safe_add(f,i)),r),m)}function md5_ff(d,_,m,f,r,i,n){return md5_cmn(_&m|~_&f,d,_,r,i,n)}function md5_gg(d,_,m,f,r,i,n){return md5_cmn(_&f|m&~f,d,_,r,i,n)}function md5_hh(d,_,m,f,r,i,n){return md5_cmn(_^m^f,d,_,r,i,n)}function md5_ii(d,_,m,f,r,i,n){return md5_cmn(m^(_|~f),d,_,r,i,n)}function safe_add(d,_){var m=(65535&d)+(65535&_);return(d>>16)+(_>>16)+(m>>16)<<16|65535&m}function bit_rol(d,_){return d<<_|d>>>32-_}

        function formatTime(seconds) {
            if (!seconds || seconds === 0 || seconds === "0" || seconds === "") return "--";
            // If it's already a formatted string like "1:09.000", return as-is
            if (typeof seconds === 'string' && seconds.includes(':')) return seconds;
            let s = parseFloat(seconds);
            if (isNaN(s) || s <= 0) return "--";
            let minutes = Math.floor(s / 60);
            let remainingSeconds = (s % 60).toFixed(3);
            if (minutes > 0) return `${minutes}:${remainingSeconds.padStart(6, '0')}`;
            return parseFloat(remainingSeconds).toFixed(3);
        }

        function isPenalty(position) {
            let pos = String(position).toUpperCase();
            return pos === 'DNF' || pos === 'DNS' || pos === 'DSQ';
        }

        // Sort by internal_standing; penalties go to bottom
        function sortDrivers(drivers) {
            return drivers.slice().sort((a, b) => {
                let aPen = isPenalty(a.position);
                let bPen = isPenalty(b.position);
                if (aPen && !bPen) return 1;
                if (!aPen && bPen) return -1;
                if (aPen && bPen) return 0;
                return (a.internal_standing || 999) - (b.internal_standing || 999);
            });
        }

        // Group drivers by class
        function groupByClass(drivers) {
            let groups = {};
            drivers.forEach(d => {
                let cls = d.class || 'Ukjent';
                if (!groups[cls]) groups[cls] = [];
                groups[cls].push(d);
            });
            return groups;
        }

        function buildTableHeader() {
            return `<div class="info-header">
                <div class="info-cell-pos info-cell-id"><i class="fas fa-hashtag"></i> #</div>
                <div class="info-cell-pos info-cell-id"><i class="fas fa-id-badge"></i> CID</div>
                <div class="info-cell-name"><i class="fas fa-user"></i> Navn</div>
                <div style="max-width: 120px;" class="info-cell-name"><i class="fas fa-user"></i> Kjøretøy</div>
                <div class="info-cell info-cell-time"><i class="fas fa-redo"></i> Runder</div>
                <div class="info-cell info-cell-time"><i class="fas fa-stopwatch"></i> Beste Runde</div>
                <div class="info-cell info-cell-time"><i class="fas fa-clock"></i> Siste Runde</div>
                <div class="info-cell info-cell-time"><i class="fas fa-clock"></i> Gap</div>
                <div class="info-cell info-cell-time"><i class="fas fa-flag-checkered"></i> Total Tid</div>
                ${standingConfig.use_points ? '<div class="info-cell info-cell-time"><i class="fas fa-star"></i> Poeng</div>' : ''}
            </div>`;
        }

        function buildDriverRow(driver) {
            console.log(driver.gap)
            let snowmobile = driver.snowmobile || '-';
            let nameDisplay = driver.first_name + " " + driver.last_name

            let bestTime = formatTime(driver.best_time);
            let lastLap = driver.last_lap_time && driver.last_lap_time !== "" && driver.last_lap_time !== "RETIRED"
                ? formatTime(driver.last_lap_time) : (driver.last_lap_time === "RETIRED" ? "RETIRED" : "--");
            let totalTime = formatTime(driver.totaltime);
            let laps = driver.laps || 0;
            let position = isPenalty(driver.position) ? driver.position : (driver.internal_standing || driver.position);

            let gap = driver.gap

            let rowClass = 'info-row';
            if (isPenalty(driver.position)) rowClass += ' penalty-driver';
            else if (driver.finished === true || driver.finished === "true") rowClass += ' finished-driver';

            return `<div class="${rowClass}">
                <div class="info-cell-pos info-cell-id">${position}</div>
                <div class="info-cell-pos info-cell-id">${driver.cid || ''}</div>
                <div class="info-cell-name">${nameDisplay}</div>
                <div class="info-cell-name" style="max-width: 120px;">${snowmobile}</div>
                <div class="info-cell info-cell-time">${laps}</div>
                <div class="info-cell info-cell-time">${bestTime}</div>
                <div class="info-cell info-cell-time">${lastLap}</div>
                <div class="info-cell info-cell-time">${gap}</div>
                <div class="info-cell info-cell-time">${totalTime}</div>
                ${standingConfig.use_points ? `<div class="info-cell info-cell-time">${driver.points || 0}</div>` : ''}
            </div>`;
        }

        function renderDriverTable(container, drivers, multiClass) {
            let html = buildTableHeader();
            html += '<div class="info-body">';

            if (multiClass && !standingConfig.mix_classes) {
                let groups = groupByClass(drivers);
                let first = true;
                for (let cls in groups) {
                    if (!first) html += `<div class="class-separator">${cls}</div>`;
                    else html += `<div class="class-separator">${cls}</div>`;
                    first = false;
                    let sorted = sortDrivers(groups[cls]);
                    sorted.forEach(d => { html += buildDriverRow(d); });
                }
            } else {
                let sorted = sortDrivers(drivers);
                sorted.forEach(d => { html += buildDriverRow(d); });
            }

            html += '</div>';
            container.innerHTML = html;
        }

        // --- Update active heat (top table) ---
        function updateActiveHeat(data) {
            if (!data || data.ERROR) return;
            activeEventData = data;

            parseTimedataFromDrivers(data);

            // Only update the visible top table if we're on the default (active) view
            if (heatBrowseIndex === null) {
                showHeatData(data);
                updateHeatNavLabel();
                updateRaceBanner();
            }
        }

        function showHeatData(data) {
            let heatText = data.HEATS > 1 ? ` Heat ${data.HEAT}/${data.HEATS}` : '';
            document.getElementById('title1').textContent = `${data.TITLE_1} — ${data.TITLE_2}${heatText}`;
            document.getElementById('heatTableTitle').textContent = `${data.TITLE_2} - Heat ${data.HEAT}`;

            updateLeadersBar(data);
            renderDriverTable(
                document.getElementById('activeHeatContent'),
                data.time_info || [],
                data.MULTI_CLASS
            );
        }

        function getActiveEventIndex() {
            return allEventsData.findIndex(e => e.ACTIVE_EVENT === true);
        }

        function updateHeatNavLabel() {
            let label = document.getElementById('heatNavLabel');
            if (heatBrowseIndex === null) {
                label.textContent = 'Aktivt heat';
            } else {
                let evt = allEventsData[heatBrowseIndex];
                if (evt) {
                    label.textContent = `${evt.TITLE_2} - Heat ${evt.HEAT}`;
                }
            }
        }

        function browseHeat(direction) {
            if (allEventsData.length === 0) return;

            let currentIdx;
            if (heatBrowseIndex === null) {
                currentIdx = getActiveEventIndex();
                if (currentIdx === -1) currentIdx = allEventsData.length - 1;
            } else {
                currentIdx = heatBrowseIndex;
            }

            let newIdx = currentIdx + direction;
            if (newIdx < 0 || newIdx >= allEventsData.length) return;

            // Check if we're back on the active event
            let activeIdx = getActiveEventIndex();
            if (newIdx === activeIdx) {
                heatBrowseIndex = null;
                showHeatData(allEventsData[newIdx]);
            } else {
                heatBrowseIndex = newIdx;
                showHeatData(allEventsData[newIdx]);
            }
            updateHeatNavLabel();
            updateRaceBanner();
        }

        function findLeaderFromDrivers(drivers) {
            let leader = null;
            drivers.forEach(d => {
                if (isPenalty(d.position)) return;
                if (!leader || (d.internal_standing || 999) < (leader.internal_standing || 999)) {
                    leader = d;
                }
            });
            return leader;
        }

        function leaderTimeStr(driver) {
            if (standingConfig.scoring_method === 'total_time') return formatTime(driver.totaltime);
            return formatTime(driver.best_time);
        }

        function updateLeadersBar(data) {
            // Heat leader: #1 in current heat
            let heatLeader = findLeaderFromDrivers(data.time_info || []);
            if (heatLeader) {
                document.getElementById('heatLeader').innerHTML =
                    `<strong>Heat Leder:</strong> ${heatLeader.first_name} ${heatLeader.last_name} - ${leaderTimeStr(heatLeader)}`;
            } else {
                document.getElementById('heatLeader').innerHTML = `<strong>Heat:</strong> Ikke startet`;
            }

            // Event leader: #1 across all heats for this TITLE_2 (from cached allEventsData)
            let eventDrivers = [];
            allEventsData.filter(e => e.TITLE_2 === data.TITLE_2).forEach(e => {
                (e.time_info || []).forEach(d => eventDrivers.push(d));
            });
            let eventLeader = findLeaderFromDrivers(eventDrivers);
            if (eventLeader) {
                document.getElementById('eventLeader').innerHTML =
                    `<strong>${data.TITLE_2}:</strong> ${eventLeader.first_name} ${eventLeader.last_name} - ${leaderTimeStr(eventLeader)}`;
            } else {
                document.getElementById('eventLeader').innerHTML = `<strong>${data.TITLE_2}:</strong> Ikke startet`;
            }

            // Day leader: #1 across ALL events (from cached allEventsData)
            let allDrivers = [];
            allEventsData.forEach(e => {
                (e.time_info || []).forEach(d => allDrivers.push(d));
            });
            let dayLeader = findLeaderFromDrivers(allDrivers);
            if (dayLeader) {
                document.getElementById('dayLeader').innerHTML =
                    `<strong>${data.TITLE_1}:</strong> ${dayLeader.first_name} ${dayLeader.last_name} - ${leaderTimeStr(dayLeader)}`;
            } else {
                document.getElementById('dayLeader').innerHTML = `<strong>${data.TITLE_1}:</strong> Ikke startet`;
            }
        }

        // --- Aggregated results (bottom table) ---
        function buildAggregatedHeader() {
            let timeCol = '';
            if (standingConfig.use_points) {
                timeCol = `<div class="info-cell"><i class="fas fa-clock"></i> Beste Runde</div>
                <div class="info-cell"><i class="fas fa-clock"></i> Total Tid</div>
                <div class="info-cell"><i class="fas fa-star"></i> Poeng</div>`;
            } else if (standingConfig.scoring_method === 'total_time') {
                timeCol = `<div class="info-cell"><i class="fas fa-clock"></i> Beste Total Tid</div>`;
            } else {
                timeCol = `<div class="info-cell"><i class="fas fa-stopwatch"></i> Beste Runde</div>`;
            }
            return `<div class="info-header">
                <div class="info-cell-pos"><i class="fas fa-trophy"></i> #</div>
                <div class="info-cell-pos"><i class="fas fa-id-badge"></i> CID</div>
                <div class="info-cell-name"><i class="fas fa-user"></i> Navn</div>
                ${timeCol}
            </div>`;
        }

        function buildAggregatedRow(item) {
            let timeCols = '';
            if (standingConfig.use_points) {
                timeCols = `<div class="info-cell">${formatTime(item.best_time)}</div>
                <div class="info-cell">${formatTime(item.totaltime)}</div>
                <div class="info-cell">${item.points || 0}</div>`;
            } else if (standingConfig.scoring_method === 'total_time') {
                timeCols = `<div class="info-cell">${formatTime(item.totaltime)}</div>`;
            } else {
                timeCols = `<div class="info-cell">${formatTime(item.best_time)}</div>`;
            }
            return `<div class="info-row">
                <div class="info-cell-pos">${item.position}</div>
                <div class="info-cell-pos">${item.cid || ''}</div>
                <div class="info-cell-name">${item.first_name} ${item.last_name}</div>
                ${timeCols}
            </div>`;
        }

        // Aggregate drivers across all heats for a given TITLE_2
        function getAggregatedDrivers(title2) {
            let driverMap = {};
            allEventsData.filter(e => e.TITLE_2 === title2).forEach(evt => {
                (evt.time_info || []).forEach(d => {
                    let cid = d.cid;
                    if (!cid) return;

                    if (!driverMap[cid]) {
                        // First entry for this driver — clone it
                        driverMap[cid] = Object.assign({}, d);
                        driverMap[cid]._totalPoints = parseFloat(d.points) || 0;
                        driverMap[cid]._bestLap = (d.best_time && parseFloat(d.best_time) > 0) ? parseFloat(d.best_time) : Infinity;
                        driverMap[cid]._bestTotal = (d.totaltime && parseFloat(d.totaltime) > 0) ? parseFloat(d.totaltime) : Infinity;
                        driverMap[cid]._hasPenaltyOnly = isPenalty(d.position);
                    } else {
                        let existing = driverMap[cid];
                        // Sum points from every heat
                        existing._totalPoints += parseFloat(d.points) || 0;

                        let bt = (d.best_time && parseFloat(d.best_time) > 0) ? parseFloat(d.best_time) : Infinity;
                        let tt = (d.totaltime && parseFloat(d.totaltime) > 0) ? parseFloat(d.totaltime) : Infinity;

                        // Track best lap time across all heats
                        if (bt < existing._bestLap) {
                            existing._bestLap = bt;
                            existing.best_time = d.best_time;
                        }

                        // Track best total time across all heats
                        if (tt < existing._bestTotal) {
                            existing._bestTotal = tt;
                            existing.totaltime = d.totaltime;
                        }

                        // If this heat is not a penalty, mark driver as having a valid run
                        if (!isPenalty(d.position)) {
                            existing._hasPenaltyOnly = false;
                        }
                    }
                });
            });

            let drivers = Object.values(driverMap);

            // Assign aggregated points back
            drivers.forEach(d => {
                d.points = d._totalPoints;
            });

            // Sort based on config
            if (standingConfig.use_points) {
                // Higher total points = better
                drivers.sort((a, b) => {
                    if (a._hasPenaltyOnly && !b._hasPenaltyOnly) return 1;
                    if (!a._hasPenaltyOnly && b._hasPenaltyOnly) return -1;
                    return (b._totalPoints || 0) - (a._totalPoints || 0);
                });
            } else if (standingConfig.scoring_method === 'total_time') {
                // Lower total time = better
                drivers.sort((a, b) => {
                    if (a._hasPenaltyOnly && !b._hasPenaltyOnly) return 1;
                    if (!a._hasPenaltyOnly && b._hasPenaltyOnly) return -1;
                    return (a._bestTotal || Infinity) - (b._bestTotal || Infinity);
                });
            } else {
                // Default: best lap — lower = better
                drivers.sort((a, b) => {
                    if (a._hasPenaltyOnly && !b._hasPenaltyOnly) return 1;
                    if (!a._hasPenaltyOnly && b._hasPenaltyOnly) return -1;
                    return (a._bestLap || Infinity) - (b._bestLap || Infinity);
                });
            }

            drivers.forEach((d, i) => { d.position = i + 1; });
            return drivers;
        }

        // Check if any event with this TITLE_2 is multi-class
        function isMultiClassEvent(title2) {
            return allEventsData.some(e => e.TITLE_2 === title2 && e.MULTI_CLASS);
        }

        function loadAggregatedForTitle(title2) {
            document.getElementById('aggregatedTableTitle').textContent = `${title2} - Sammenlagt`;

            let drivers = getAggregatedDrivers(title2);
            let multiClass = isMultiClassEvent(title2);
            let container = document.getElementById('aggregatedContent');
            let html = buildAggregatedHeader();
            html += '<div class="info-body">';

            if (multiClass && !standingConfig.mix_classes) {
                let groups = groupByClass(drivers);
                for (let cls in groups) {
                    html += `<div class="class-separator">${cls}</div>`;
                    // Re-number positions within each class
                    groups[cls].forEach((item, i) => { item.position = i + 1; });
                    groups[cls].forEach(item => { html += buildAggregatedRow(item); });
                }
            } else {
                drivers.forEach(item => { html += buildAggregatedRow(item); });
            }

            html += '</div>';
            container.innerHTML = html;
        }

        // --- Build event dropdown from allEventsData ---
        function populateEventDropdown() {
            let dropdown = document.getElementById('eventDropdown');
            dropdown.innerHTML = '<option value="">Aktivt løp</option>';

            let seen = new Set();
            allEventsData.forEach(evt => {
                if (!seen.has(evt.TITLE_2)) {
                    seen.add(evt.TITLE_2);
                    let option = document.createElement('option');
                    option.value = evt.TITLE_2;
                    option.textContent = evt.TITLE_2;
                    dropdown.appendChild(option);
                }
            });
        }

        function getUniqueTitle2s() {
            let seen = new Set();
            let unique = [];
            allEventsData.forEach(evt => {
                if (!seen.has(evt.TITLE_2)) {
                    seen.add(evt.TITLE_2);
                    unique.push(evt.TITLE_2);
                }
            });
            return unique;
        }

        // --- Find the active event from allEventsData ---
        function findActiveEvent(events) {
            let active = events.find(e => e.ACTIVE_EVENT === true);
            return active || events[events.length - 1] || null;
        }

        // --- Initial load ---
        async function initialLoad() {
            // Fetch standing config and all events in parallel
            let [configRes, eventsRes] = await Promise.all([
                fetch('/api/get_standing_config').then(r => r.json()),
                fetch('/api/get_event_data').then(r => r.json())
            ]);

            standingConfig = configRes;

            if (Array.isArray(eventsRes)) {
                allEventsData = eventsRes;
            } else if (eventsRes.time_info) {
                allEventsData = [eventsRes];
            }

            populateEventDropdown();

            // Show active event in top table
            let active = findActiveEvent(allEventsData);
            if (active) {
                updateActiveHeat(active);
                loadAggregatedForTitle(active.TITLE_2);
                updateRaceBanner();
            }
        }

        // --- Event handlers ---
        document.addEventListener('DOMContentLoaded', function() {
            initialLoad();

            document.getElementById('eventDropdown').addEventListener('change', function() {
                if (this.value === '') {
                    if (activeEventData) loadAggregatedForTitle(activeEventData.TITLE_2);
                } else {
                    loadAggregatedForTitle(this.value);
                }
            });

            document.getElementById('btnPrevHeat').addEventListener('click', function() {
                browseHeat(-1);
            });

            document.getElementById('btnNextHeat').addEventListener('click', function() {
                browseHeat(1);
            });

            document.getElementById('btnPrevEvent').addEventListener('click', function() {
                let dropdown = document.getElementById('eventDropdown');
                let events = getUniqueTitle2s();
                let idx = events.indexOf(dropdown.value);
                if (idx > 0) {
                    dropdown.value = events[idx - 1];
                    loadAggregatedForTitle(events[idx - 1]);
                }
            });

            document.getElementById('btnNextEvent').addEventListener('click', function() {
                let dropdown = document.getElementById('eventDropdown');
                let events = getUniqueTitle2s();
                let idx = events.indexOf(dropdown.value);
                if (idx < events.length - 1) {
                    dropdown.value = events[idx + 1];
                    loadAggregatedForTitle(events[idx + 1]);
                }
            });

            initializeWebSocket();
        });

        // --- WebSocket ---
        function initializeWebSocket() {
            let socket = io.connect('http://' + document.domain + ':' + location.port);

            socket.on('connect', function() {
                socket.emit('join', { username: 'speaker_cross_v2', room: 'default' });
                socket.emit('join', { username: 'speaker_cross_v2', room: 'start_state' });
            });

            // Race state from start_state room
            socket.on('response', function(dataString) {
                try {
                    let data = typeof dataString === 'string' ? JSON.parse(dataString) : dataString;
                    // Start state update (has man_ready key)
                    if (data.man_ready !== undefined) {
                        onRaceStateChanged(data);
                        return;
                    }

                    // Race data update (has RACE_TYPE + time_info)
                    if (data.RACE_TYPE === undefined || data.time_info === undefined) return;

                    let newHash = MD5(JSON.stringify(data));
                    if (newHash !== old_results) {
                        console.log(data)

                        // Reset heat browsing back to active event on new data
                        heatBrowseIndex = null;
                        updateHeatNavLabel();

                        updateActiveHeat(data);

                        // Also update this event in allEventsData cache
                        let idx = allEventsData.findIndex(e => e.TITLE_2 === data.TITLE_2 && e.HEAT === data.HEAT);
                        if (idx >= 0) allEventsData[idx] = data;
                        else allEventsData.push(data);

                        // Refresh aggregated if showing the same event
                        let dropdown = document.getElementById('eventDropdown');
                        if (dropdown.value === '' || dropdown.value === data.TITLE_2) {
                            loadAggregatedForTitle(data.TITLE_2);
                        }

                        old_results = newHash;
                    }
                } catch (e) {
                    console.error('Error parsing WebSocket data:', e);
                }
            });

            startCountdownTicker();
        }
    </script>
</body>
</html>
