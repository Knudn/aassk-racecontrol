<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Løpsinformasjon - Orbits</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="{{url_for('static', filename='js/socket.io.js')}}"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');

        :root {
            --primary-color: #2c3e50;
            --background-color: #ecf0f1;
            --text-color: #34495e;
            --border-color: #bdc3c7;
        }
        #top_driver_bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            font-size: 14px;
            line-height: 1.3;
        }
        .info-cell-id { max-width: 50px; }
        .container { width: 100%; padding: 10px; }
        .title-container {
            text-align: center;
            margin-bottom: 6px;
            padding: 8px 10px;
            background-color: var(--primary-color);
            color: white;
        }
        h1 { font-size: 1.5em; font-weight: 700; }
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .nav-controls select { flex: 1; padding: 2px 6px; font-size: 0.85em; }
        .nav-controls .btn { min-width: 36px; padding: 2px 8px; font-size: 0.85em; }
        .info-section {
            background-color: white;
            width: 100%;
            margin-bottom: 10px;
        }
        .info-cell-time { max-width: 120px; }
        .info-header {
            background-color: var(--primary-color);
            color: white;
            padding: 4px 0;
            font-weight: bold;
            font-size: 0.85em;
            display: flex;
        }
        .info-body {
            border: 1px solid var(--border-color);
            border-top: none;
        }
        .info-row {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }
        .info-row:last-child { border-bottom: none; }
        .info-cell {
            flex: 1;
            padding: 3px 6px;
            text-align: center;
        }
        .info-cell-pos {
            flex: 0.5;
            padding: 3px 6px;
            text-align: center;
        }
        .info-cell-name {
            flex: 2;
            padding: 3px 6px;
            text-align: left;
        }
        .info-cell i { margin-right: 3px; color: var(--primary-color); }
        .info-header .info-cell i,
        .info-header .info-cell-pos i,
        .info-header .info-cell-name i { color: white; }
        .section-title {
            background-color: #34495e;
            color: white;
            padding: 4px 10px;
            font-size: 0.9em;
            font-weight: bold;
        }
        .class-separator {
            display: flex;
            align-items: center;
            padding: 3px 10px;
            background-color: #f0f0f0;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            color: #555;
            font-size: 0.8em;
        }
        .class-separator::before, .class-separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #aaa;
        }
        .class-separator::before { margin-right: 8px; }
        .class-separator::after  { margin-left: 8px; }
        .finished-driver { background-color: #e8f5e9; }
        .penalty-driver  { background-color: #ffebee; }
        .next-event-banner {
            display: flex;
            align-items: center;
            padding: 5px 12px;
            background: #2980b9;
            color: #fff;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 6px;
            cursor: pointer;
            user-select: none;
        }
        .next-event-banner:hover { background: #2471a3; }
        .next-event-banner .neb-toggle { font-size: 1.1em; padding: 0 10px; }
        .all-events-panel {
            display: none;
            background: #fff;
            border: 1px solid var(--border-color);
            margin-bottom: 6px;
            max-height: 280px;
            overflow-y: auto;
        }
        .all-events-panel .evt-row {
            display: flex;
            align-items: center;
            padding: 5px 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85em;
            gap: 8px;
        }
        .all-events-panel .evt-row:last-child { border-bottom: none; }
        .all-events-panel .evt-row.evt-current {
            background: #fff3cd;
            border-left: 3px solid #e67e22;
            font-weight: bold;
        }
        .all-events-panel .evt-row.evt-finished { color: #aaa; }
        .tb-highlight {
            box-shadow: inset 0 0 0 2px #e67e22;
            border-radius: 3px;
            font-weight: bold;
            color: #c0550a;
        }
        .race-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 12px;
            font-size: 0.85em;
            font-weight: 700;
            color: #fff;
            background: #555;
            margin-bottom: 0;
        }
        .race-banner .flag-dot {
            width: 14px; height: 14px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            vertical-align: middle;
            border: 1px solid rgba(255,255,255,0.4);
        }
        .race-banner .countdown {
            font-size: 1.15em;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
        }
        @media (max-width: 768px) {
            .info-header, .info-row { flex-direction: column; }
            .info-cell, .info-cell-pos, .info-cell-name {
                padding: 3px 6px;
                border-bottom: 1px solid var(--border-color);
            }
            .info-cell:last-child { border-bottom: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-container">
            <h1 id="title1">Laster...</h1>
        </div>

        <div class="alert alert-warning" role="alert" style="padding:3px 8px; margin-bottom:6px; font-size: 13px;" id="top_driver_bar">
            <span id="heatLeader"><strong>Heat:</strong> --</span>
            <span id="eventLeader"><strong>Løp:</strong> --</span>
            <span id="dayLeader"><strong>Dag:</strong> --</span>
        </div>

        <!-- Next event banner -->
        <div class="next-event-banner" id="nextEventBanner">
            <span style="flex:1;">Neste løp: <span id="nextEventText">--</span></span>
            <span class="neb-toggle" id="nebToggle" title="Vis alle løp">&#9660;</span>
            <span style="flex:1;"></span>
        </div>
        <div class="all-events-panel" id="allEventsPanel">
            <div id="allEventsList"></div>
        </div>

        <!-- Navigation for active heat table -->
        <div class="nav-controls">
            <button class="btn btn-secondary" id="btnPrevHeat"><i class="fas fa-arrow-left"></i></button>
            <span id="heatNavLabel" style="flex:1; text-align:center; align-self:center; font-weight:bold; font-size:0.85em;">Aktivt heat</span>
            <button class="btn btn-secondary" id="btnNextHeat"><i class="fas fa-arrow-right"></i></button>
        </div>

        <!-- Top table: active heat results -->
        <div class="info-section">
            <div class="race-banner" id="raceBanner" style="display:none;">
                <span><span class="flag-dot" id="flagDot"></span><span id="flagLabel">--</span></span>
                <span id="orbitsHeatInfo" style="font-size:0.9em; opacity:0.85;"></span>
                <span class="countdown" id="countdownDisplay">--:--</span>
            </div>
            <div class="section-title" id="heatTableTitle">Heat Resultater</div>
            <div id="activeHeatContent"></div>
        </div>

        <!-- Navigation for aggregated table -->
        <div class="nav-controls">
            <button class="btn btn-secondary" id="btnPrevEvent"><i class="fas fa-arrow-left"></i></button>
            <select id="eventDropdown" class="form-select" aria-label="Velg løp">
                <option selected value="">Aktivt løp</option>
            </select>
            <button class="btn btn-secondary" id="btnNextEvent"><i class="fas fa-arrow-right"></i></button>
        </div>

        <!-- Bottom table: aggregated event results -->
        <div class="info-section">
            <div class="section-title" id="aggregatedTableTitle">Sammenlagt</div>
            <div id="aggregatedContent"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script>
        let old_results = '';
        let allEventsData = [];
        let activeEventData = null;
        let standingConfig = { scoring_method: 'best_lap', use_points: false, mix_classes: false };
        let heatBrowseIndex = null;
        let orbitsData = null;

        // --- Race banner (orbits-only flag state) ---
        function updateRaceBanner() {
            let banner = document.getElementById('raceBanner');
            if (heatBrowseIndex !== null) {
                banner.style.display = 'none';
                return;
            }
            banner.style.display = 'flex';
            updateFlagIndicator();
        }

        function updateFlagIndicator() {
            let dot    = document.getElementById('flagDot');
            let label  = document.getElementById('flagLabel');
            let banner = document.getElementById('raceBanner');
            let status = orbitsData ? (orbitsData.status || '') : '';

            let color, text, bg;
            if (status === 'Red' || status === 'red') {
                color = '#e74c3c'; text = 'Rødt flagg'; bg = '#c0392b';
            } else if (status === 'warmup') {
                color = '#9b59b6'; text = 'Oppvarming'; bg = '#7d3c98';
            } else if (status === 'Green') {
                color = '#2ecc71'; text = 'Grønt'; bg = '#27ae60';
            } else if (status === 'Finish') {
                color = '#3498db'; text = 'Ferdig'; bg = '#2980b9';
            } else {
                color = '#888'; text = 'Inaktiv'; bg = '#555';
            }
            dot.style.background    = color;
            label.textContent       = text;
            banner.style.background = bg;
        }

        // --- Orbits display proxy WebSocket ---
        function connectOrbitsWS() {
            let ws = new WebSocket('ws://' + window.location.hostname + ':4444');
            ws.onopen    = function() { console.log('Orbits WS connected'); };
            ws.onmessage = function(event) {
                try {
                    orbitsData = JSON.parse(event.data);
                    updateOrbitsDisplay();
                } catch(e) { console.error('Orbits WS parse error:', e); }
            };
            ws.onclose = function() {
                console.log('Orbits WS disconnected, reconnecting in 3s...');
                setTimeout(connectOrbitsWS, 3000);
            };
            ws.onerror = function(e) { console.error('Orbits WS error:', e); };
        }

        function updateOrbitsDisplay() {
            if (!orbitsData) return;
            let timer  = orbitsData.timer  || '--:--';
            let laps   = orbitsData.laps_to_go || 0;
            let status = orbitsData.status || '';
            let heat   = orbitsData.heat   || 0;
            let heats  = orbitsData.heats  || 0;

            let timerEl = document.getElementById('countdownDisplay');
            if (status === 'Finish') {
                timerEl.textContent = 'Ferdig';
            } else if (laps > 0 && status === 'Green') {
                let lapsText = laps === 1 ? 'Siste runde' : laps + ' runder igjen';
                timerEl.textContent = timer + '  ·  ' + lapsText;
            } else {
                timerEl.textContent = timer;
            }

            let heatEl = document.getElementById('orbitsHeatInfo');
            if (heats > 1) {
                heatEl.textContent = 'Heat ' + heat + '/' + heats;
            } else if (heat) {
                heatEl.textContent = 'Heat ' + heat;
            } else {
                heatEl.textContent = '';
            }

            if (heatBrowseIndex === null) updateFlagIndicator();
        }

        // --- MD5 ---
        function MD5(d){var r=M(V(Y(X(d),8*d.length)));return r.toLowerCase()};function M(d){for(var _,m="0123456789ABCDEF",f="",r=0;r<d.length;r++)_=d.charCodeAt(r),f+=m.charAt(_>>>4&15)+m.charAt(15&_);return f}function X(d){for(var _=Array(d.length>>2),m=0;m<_.length;m++)_[m]=0;for(m=0;m<8*d.length;m+=8)_[m>>5]|=(255&d.charCodeAt(m/8))<<m%32;return _}function V(d){for(var _="",m=0;m<32*d.length;m+=8)_+=String.fromCharCode(d[m>>5]>>>m%32&255);return _}function Y(d,_){d[_>>5]|=128<<_%32,d[14+(_+64>>>9<<4)]=_;for(var m=1732584193,f=-271733879,r=-1732584194,i=271733878,n=0;n<d.length;n+=16){var h=m,t=f,g=r,e=i;f=md5_ii(f=md5_ii(f=md5_ii(f=md5_ii(f=md5_hh(f=md5_hh(f=md5_hh(f=md5_hh(f=md5_gg(f=md5_gg(f=md5_gg(f=md5_gg(f=md5_ff(f=md5_ff(f=md5_ff(f=md5_ff(f,r=md5_ff(r,i=md5_ff(i,m=md5_ff(m,f,r,i,d[n+0],7,-680876936),f,r,d[n+1],12,-389564586),m,f,d[n+2],17,606105819),i,m,d[n+3],22,-1044525330),r=md5_ff(r,i=md5_ff(i,m=md5_ff(m,f,r,i,d[n+4],7,-176418897),f,r,d[n+5],12,1200080426),m,f,d[n+6],17,-1473231341),i,m,d[n+7],22,-45705983),r=md5_ff(r,i=md5_ff(i,m=md5_ff(m,f,r,i,d[n+8],7,1770035416),f,r,d[n+9],12,-1958414417),m,f,d[n+10],17,-42063),i,m,d[n+11],22,-1990404162),r=md5_ff(r,i=md5_ff(i,m=md5_ff(m,f,r,i,d[n+12],7,1804603682),f,r,d[n+13],12,-40341101),m,f,d[n+14],17,-1502002290),i,m,d[n+15],22,1236535329),r=md5_gg(r,i=md5_gg(i,m=md5_gg(m,f,r,i,d[n+1],5,-165796510),f,r,d[n+6],9,-1069501632),m,f,d[n+11],14,643717713),i,m,d[n+0],20,-373897302),r=md5_gg(r,i=md5_gg(i,m=md5_gg(m,f,r,i,d[n+5],5,-701558691),f,r,d[n+10],9,38016083),m,f,d[n+15],14,-660478335),i,m,d[n+4],20,-405537848),r=md5_gg(r,i=md5_gg(i,m=md5_gg(m,f,r,i,d[n+9],5,568446438),f,r,d[n+14],9,-1019803690),m,f,d[n+3],14,-187363961),i,m,d[n+8],20,1163531501),r=md5_gg(r,i=md5_gg(i,m=md5_gg(m,f,r,i,d[n+13],5,-1444681467),f,r,d[n+2],9,-51403784),m,f,d[n+7],14,1735328473),i,m,d[n+12],20,-1926607734),r=md5_hh(r,i=md5_hh(i,m=md5_hh(m,f,r,i,d[n+5],4,-378558),f,r,d[n+8],11,-2022574463),m,f,d[n+11],16,1839030562),i,m,d[n+14],23,-35309556),r=md5_hh(r,i=md5_hh(i,m=md5_hh(m,f,r,i,d[n+1],4,-1530992060),f,r,d[n+4],11,1272893353),m,f,d[n+7],16,-155497632),i,m,d[n+10],23,-1094730640),r=md5_hh(r,i=md5_hh(i,m=md5_hh(m,f,r,i,d[n+13],4,681279174),f,r,d[n+0],11,-358537222),m,f,d[n+3],16,-722521979),i,m,d[n+6],23,76029189),r=md5_hh(r,i=md5_hh(i,m=md5_hh(m,f,r,i,d[n+9],4,-640364487),f,r,d[n+12],11,-421815835),m,f,d[n+15],16,530742520),i,m,d[n+2],23,-995338651),r=md5_ii(r,i=md5_ii(i,m=md5_ii(m,f,r,i,d[n+0],6,-198630844),f,r,d[n+7],10,1126891415),m,f,d[n+14],15,-1416354905),i,m,d[n+5],21,-57434055),r=md5_ii(r,i=md5_ii(i,m=md5_ii(m,f,r,i,d[n+12],6,1700485571),f,r,d[n+3],10,-1894986606),m,f,d[n+10],15,-1051523),i,m,d[n+1],21,-2054922799),r=md5_ii(r,i=md5_ii(i,m=md5_ii(m,f,r,i,d[n+8],6,1873313359),f,r,d[n+15],10,-30611744),m,f,d[n+6],15,-1560198380),i,m,d[n+13],21,1309151649),r=md5_ii(r,i=md5_ii(i,m=md5_ii(m,f,r,i,d[n+4],6,-145523070),f,r,d[n+11],10,-1120210379),m,f,d[n+2],15,718787259),i,m,d[n+9],21,-343485551),m=safe_add(m,h),f=safe_add(f,t),r=safe_add(r,g),i=safe_add(i,e)}return Array(m,f,r,i)}function md5_cmn(d,_,m,f,r,i){return safe_add(bit_rol(safe_add(safe_add(_,d),safe_add(f,i)),r),m)}function md5_ff(d,_,m,f,r,i,n){return md5_cmn(_&m|~_&f,d,_,r,i,n)}function md5_gg(d,_,m,f,r,i,n){return md5_cmn(_&f|m&~f,d,_,r,i,n)}function md5_hh(d,_,m,f,r,i,n){return md5_cmn(_^m^f,d,_,r,i,n)}function md5_ii(d,_,m,f,r,i,n){return md5_cmn(m^(_|~f),d,_,r,i,n)}function safe_add(d,_){var m=(65535&d)+(65535&_);return(d>>16)+(_>>16)+(m>>16)<<16|65535&m}function bit_rol(d,_){return d<<_|d>>>32-_}

        function formatTime(val) {
            if (!val || val === 0 || val === "0" || val === "") return "--";
            if (typeof val === 'string' && val.includes(':')) return val;
            let s = parseFloat(val);
            if (isNaN(s) || s <= 0) return "--";
            let minutes = Math.floor(s / 60);
            let rem = (s % 60).toFixed(3);
            if (minutes > 0) return `${minutes}:${rem.padStart(6, '0')}`;
            return parseFloat(rem).toFixed(3);
        }

        function isPenalty(position) {
            let pos = String(position).toUpperCase();
            return pos === 'DNF' || pos === 'DNS' || pos === 'DSQ';
        }

        function sortDrivers(drivers) {
            return drivers.slice().sort((a, b) => {
                let aPen = isPenalty(a.position);
                let bPen = isPenalty(b.position);
                if (aPen && !bPen) return 1;
                if (!aPen && bPen) return -1;
                if (aPen && bPen) return 0;
                return (a.internal_standing || 999) - (b.internal_standing || 999);
            });
        }

        function groupByClass(drivers) {
            let groups = {};
            drivers.forEach(d => {
                let cls = d.class || 'Ukjent';
                if (!groups[cls]) groups[cls] = [];
                groups[cls].push(d);
            });
            return groups;
        }

        function buildTableHeader() {
            return `<div class="info-header">
                <div class="info-cell-pos info-cell-id"><i class="fas fa-hashtag"></i> #</div>
                <div class="info-cell-pos info-cell-id"><i class="fas fa-id-badge"></i> CID</div>
                <div class="info-cell-name"><i class="fas fa-user"></i> Navn</div>
                <div style="max-width:120px;" class="info-cell-name"><i class="fas fa-snowflake"></i> Kjøretøy</div>
                <div class="info-cell-name"><i class="fas fa-users"></i> Klubb</div>
                <div class="info-cell info-cell-time"><i class="fas fa-clock"></i> Gap</div>
                <div class="info-cell info-cell-time"><i class="fas fa-flag-checkered"></i> Total Tid</div>
                ${standingConfig.use_points ? '<div class="info-cell info-cell-time"><i class="fas fa-star"></i> Poeng</div>' : ''}
            </div>`;
        }

        function buildDriverRow(driver) {
            let snowmobile  = driver.snowmobile || '-';
            let club        = driver.club || '-';
            let nameDisplay = (driver.first_name || '') + ' ' + (driver.last_name || '');
            let bestTime    = formatTime(driver.best_time);
            let lastLap     = driver.last_lap_time && driver.last_lap_time !== "" && driver.last_lap_time !== "RETIRED"
                ? formatTime(driver.last_lap_time) : (driver.last_lap_time === "RETIRED" ? "RETIRED" : "--");
            let totalTime   = formatTime(driver.totaltime);
            let gap         = driver.gap != null ? driver.gap : '--';
            let position    = isPenalty(driver.position) ? driver.position : (driver.internal_standing || driver.position || '--');

            let rowClass = 'info-row';
            if (isPenalty(driver.position)) rowClass += ' penalty-driver';
            else if (driver.finished === true || driver.finished === "true") rowClass += ' finished-driver';

            return `<div class="${rowClass}">
                <div class="info-cell-pos info-cell-id">${position}</div>
                <div class="info-cell-pos info-cell-id">${driver.cid || ''}</div>
                <div class="info-cell-name">${nameDisplay}</div>
                <div class="info-cell-name" style="max-width:120px;">${snowmobile}</div>
                <div class="info-cell-name">${club}</div>
                <div class="info-cell info-cell-time">${gap}</div>
                <div class="info-cell info-cell-time">${totalTime}</div>
                ${standingConfig.use_points ? `<div class="info-cell info-cell-time">${driver.points || 0}</div>` : ''}
            </div>`;
        }

        function renderDriverTable(container, drivers, multiClass) {
            let html = buildTableHeader();
            html += '<div class="info-body">';
            if (multiClass && !standingConfig.mix_classes) {
                let groups = groupByClass(drivers);
                for (let cls in groups) {
                    html += `<div class="class-separator">${cls}</div>`;
                    sortDrivers(groups[cls]).forEach(d => { html += buildDriverRow(d); });
                }
            } else {
                sortDrivers(drivers).forEach(d => { html += buildDriverRow(d); });
            }
            html += '</div>';
            container.innerHTML = html;
        }

        // --- Active heat ---
        function updateActiveHeat(data) {
            if (!data || data.ERROR) return;
            activeEventData = data;
            updateNextEventBanner();
            if (heatBrowseIndex === null) {
                showHeatData(data);
                updateHeatNavLabel();
                updateRaceBanner();
            }
        }

        function showHeatData(data) {
            let heatText = data.HEATS > 1 ? ` Heat ${data.HEAT}/${data.HEATS}` : '';
            document.getElementById('title1').textContent = `${data.TITLE_1 || ''} — ${data.TITLE_2 || ''}${heatText}`;
            document.getElementById('heatTableTitle').textContent = `${data.TITLE_2 || ''} - Heat ${data.HEAT}`;
            updateLeadersBar(data);
            renderDriverTable(
                document.getElementById('activeHeatContent'),
                data.time_info || [],
                data.MULTI_CLASS
            );
        }

        function getActiveEventIndex() {
            return allEventsData.findIndex(e => e.ACTIVE_EVENT === true);
        }

        function updateHeatNavLabel() {
            let label = document.getElementById('heatNavLabel');
            if (heatBrowseIndex === null) {
                label.textContent = 'Aktivt heat';
            } else {
                let evt = allEventsData[heatBrowseIndex];
                if (evt) label.textContent = `${evt.TITLE_2} - Heat ${evt.HEAT}`;
            }
        }

        function browseHeat(direction) {
            if (allEventsData.length === 0) return;
            let currentIdx = heatBrowseIndex !== null ? heatBrowseIndex : getActiveEventIndex();
            if (currentIdx === -1) currentIdx = allEventsData.length - 1;
            let newIdx = currentIdx + direction;
            if (newIdx < 0 || newIdx >= allEventsData.length) return;
            heatBrowseIndex = (newIdx === getActiveEventIndex()) ? null : newIdx;
            showHeatData(allEventsData[newIdx]);
            updateHeatNavLabel();
            updateRaceBanner();
        }

        function findLeaderFromDrivers(drivers) {
            let leader = null;
            drivers.forEach(d => {
                if (isPenalty(d.position)) return;
                if (!leader || (d.internal_standing || 999) < (leader.internal_standing || 999)) leader = d;
            });
            return leader;
        }

        function leaderTimeStr(driver) {
            if (standingConfig.scoring_method === 'total_time') return formatTime(driver.totaltime);
            return formatTime(driver.best_time);
        }

        function updateLeadersBar(data) {
            let heatLeader = findLeaderFromDrivers(data.time_info || []);
            document.getElementById('heatLeader').innerHTML = heatLeader
                ? `<strong>Heat Leder:</strong> ${heatLeader.first_name} ${heatLeader.last_name} - ${leaderTimeStr(heatLeader)}`
                : `<strong>Heat:</strong> Ikke startet`;

            let eventDrivers = [];
            allEventsData.filter(e => e.TITLE_2 === data.TITLE_2).forEach(e => {
                (e.time_info || []).forEach(d => eventDrivers.push(d));
            });
            let eventLeader = findLeaderFromDrivers(eventDrivers);
            document.getElementById('eventLeader').innerHTML = eventLeader
                ? `<strong>${data.TITLE_2}:</strong> ${eventLeader.first_name} ${eventLeader.last_name} - ${leaderTimeStr(eventLeader)}`
                : `<strong>${data.TITLE_2 || 'Løp'}:</strong> Ikke startet`;

            let allDrivers = [];
            allEventsData.forEach(e => { (e.time_info || []).forEach(d => allDrivers.push(d)); });
            let dayLeader = findLeaderFromDrivers(allDrivers);
            document.getElementById('dayLeader').innerHTML = dayLeader
                ? `<strong>${data.TITLE_1 || 'Dag'}:</strong> ${dayLeader.first_name} ${dayLeader.last_name} - ${leaderTimeStr(dayLeader)}`
                : `<strong>${data.TITLE_1 || 'Dag'}:</strong> Ikke startet`;
        }

        // --- Aggregated results ---
        async function fetchKvaliResults(eventPrefix) {
            try {
                let res = await fetch(`/api/get_kvali_results?event_prefix=${encodeURIComponent(eventPrefix)}`);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return await res.json();
            } catch (e) {
                console.error('Failed to fetch kvali results:', e);
                return null;
            }
        }

        function getRKeys(results) {
            let keys = new Set();
            results.forEach(r => { Object.keys(r).forEach(k => { if (/^R\d+$/.test(k)) keys.add(k); }); });
            return Array.from(keys).sort((a, b) => parseInt(a.slice(1)) - parseInt(b.slice(1)));
        }

        function parseTbTime(str) {
            if (!str || str === '0.000' || str === 'DNF' || str === 'DNS' || str === '--') return Infinity;
            if (str.includes(':')) {
                let parts = str.split(':');
                return parseInt(parts[0]) * 60 + parseFloat(parts[1]);
            }
            let v = parseFloat(str);
            return isNaN(v) || v <= 0 ? Infinity : v;
        }

        function computeTiebreakerHighlights(results, tiebreakers) {
            const tbDef = {
                laps:                { field: 'total_laps',         cmp: (a, b) => parseInt(b||0) - parseInt(a||0) },
                combined_finishtime: { field: 'combined_finishtime', cmp: (a, b) => parseTbTime(a) - parseTbTime(b) },
                lowest_finishtime:   { field: 'lowest_finishtime',   cmp: (a, b) => parseTbTime(a) - parseTbTime(b) },
                best_lap_time:       { field: 'best_lap_time',       cmp: (a, b) => parseTbTime(a) - parseTbTime(b) },
            };
            let highlights = {};
            for (let i = 0; i < results.length - 1; i++) {
                let a = results[i], b = results[i + 1];
                if ((a.combined_points || 0) !== (b.combined_points || 0)) continue;
                for (let tb of tiebreakers) {
                    let def = tbDef[tb];
                    if (!def) continue;
                    if (def.cmp(a[def.field], b[def.field]) !== 0) {
                        if (!highlights[a.cid]) highlights[a.cid] = new Set();
                        highlights[a.cid].add(tb);
                        break;
                    }
                }
            }
            return highlights;
        }

        function buildKvaliHeader(showClassCol, rKeys, tiebreakers) {
            let showLaps       = tiebreakers.includes('laps');
            let showBestLap    = tiebreakers.includes('best_lap_time');
            let showLowest     = tiebreakers.includes('lowest_finishtime');
            let showCombined   = rKeys.length <= 10;
            let rCols = rKeys.map(k => `<div class="info-cell info-cell-time"><i class="fas fa-flag"></i> ${k}</div>`).join('');
            return `<div class="info-header">
                <div class="info-cell-pos"><i class="fas fa-trophy"></i> #</div>
                <div class="info-cell-pos"><i class="fas fa-id-badge"></i> CID</div>
                <div class="info-cell-name"><i class="fas fa-user"></i> Navn</div>
                ${showClassCol ? '<div class="info-cell"><i class="fas fa-tag"></i> Klasse</div>' : ''}
                ${rCols}
                ${showLaps    ? '<div class="info-cell info-cell-time"><i class="fas fa-redo"></i> Runder</div>' : ''}
                ${showBestLap ? '<div class="info-cell info-cell-time"><i class="fas fa-stopwatch"></i> Beste Runde</div>' : ''}
                ${showLowest  ? '<div class="info-cell info-cell-time"><i class="fas fa-flag-checkered"></i> Beste Løpstid</div>' : ''}
                <div class="info-cell info-cell-time"><i class="fas fa-star"></i> Poeng</div>
                ${showCombined ? '<div class="info-cell info-cell-time"><i class="fas fa-clock"></i> Sammenlagt Tid</div>' : ''}
            </div>`;
        }

        function buildKvaliRow(item, showClassCol, rKeys, tiebreakers, driverHighlights) {
            let showLaps       = tiebreakers.includes('laps');
            let showBestLap    = tiebreakers.includes('best_lap_time');
            let showLowest     = tiebreakers.includes('lowest_finishtime');
            let showCombined   = rKeys.length <= 10;
            let hl = driverHighlights || new Set();
            let rCols = rKeys.map(k => {
                let time = item[k];
                let pts  = item[k + '_POINTS'];
                let display    = (time && time !== '0.000') ? time : '--';
                let ptsDisplay = (pts && pts > 0) ? `<span style="font-size:0.8em;color:#888;">(${pts}p)</span>` : '';
                return `<div class="info-cell info-cell-time">${display} ${ptsDisplay}</div>`;
            }).join('');
            let hlCombined = hl.has('combined_finishtime') ? ' tb-highlight' : '';
            let hlLowest   = hl.has('lowest_finishtime')   ? ' tb-highlight' : '';
            let hlBestLap  = hl.has('best_lap_time')       ? ' tb-highlight' : '';
            let hlLaps     = hl.has('laps')                ? ' tb-highlight' : '';
            let lowestTime = (item.lowest_finishtime && item.lowest_finishtime !== '0.000') ? item.lowest_finishtime : '--';
            return `<div class="info-row">
                <div class="info-cell-pos">${item.internal_standing}</div>
                <div class="info-cell-pos">${item.cid || ''}</div>
                <div class="info-cell-name">${item.first_name} ${item.last_name}</div>
                ${showClassCol ? `<div class="info-cell">${item.class || ''}</div>` : ''}
                ${rCols}
                ${showLaps    ? `<div class="info-cell info-cell-time${hlLaps}">${item.total_laps || 0}</div>` : ''}
                ${showBestLap ? `<div class="info-cell info-cell-time${hlBestLap}">${item.best_lap_time || '--'}</div>` : ''}
                ${showLowest  ? `<div class="info-cell info-cell-time${hlLowest}">${lowestTime}</div>` : ''}
                <div class="info-cell info-cell-time">${item.combined_points || 0}</div>
                ${showCombined ? `<div class="info-cell info-cell-time${hlCombined}">${item.combined_finishtime || '--'}</div>` : ''}
            </div>`;
        }

        async function loadAggregatedForTitle(title2) {
            document.getElementById('aggregatedTableTitle').textContent = `${title2} - Sammenlagt`;
            document.getElementById('aggregatedContent').innerHTML = '<div style="padding:10px;text-align:center;color:#888;">Laster...</div>';
            let data = await fetchKvaliResults(title2);
            if (!data || !data.results) {
                document.getElementById('aggregatedContent').innerHTML = '<div style="padding:10px;text-align:center;color:#c00;">Ingen data tilgjengelig</div>';
                return;
            }
            let meta             = data.meta;
            let results          = data.results;
            let hasMultipleClasses = meta.has_multiple_classes;
            let mixClasses       = meta.mix_classes;
            let tiebreakers      = meta.tiebreakers || [];
            let rKeys            = getRKeys(results);
            let showClassCol     = hasMultipleClasses && mixClasses;
            let highlights       = computeTiebreakerHighlights(results, tiebreakers);
            let container        = document.getElementById('aggregatedContent');
            let html             = buildKvaliHeader(showClassCol, rKeys, tiebreakers);
            html += '<div class="info-body">';
            if (hasMultipleClasses && !mixClasses) {
                let groups = {}, groupOrder = [];
                results.forEach(r => {
                    let cls = r.class || 'Ukjent';
                    if (!groups[cls]) { groups[cls] = []; groupOrder.push(cls); }
                    groups[cls].push(r);
                });
                groupOrder.forEach(cls => {
                    let groupHighlights = computeTiebreakerHighlights(groups[cls], tiebreakers);
                    html += `<div class="class-separator">${cls}</div>`;
                    groups[cls].forEach((item, i) => {
                        let it = Object.assign({}, item, { internal_standing: i + 1 });
                        html += buildKvaliRow(it, showClassCol, rKeys, tiebreakers, groupHighlights[item.cid]);
                    });
                });
            } else {
                results.forEach(item => { html += buildKvaliRow(item, showClassCol, rKeys, tiebreakers, highlights[item.cid]); });
            }
            html += '</div>';
            container.innerHTML = html;
        }

        // --- Event dropdown ---
        function populateEventDropdown() {
            let dropdown = document.getElementById('eventDropdown');
            dropdown.innerHTML = '<option value="">Aktivt løp</option>';
            let seen = new Set();
            allEventsData.forEach(evt => {
                if (!seen.has(evt.TITLE_2)) {
                    seen.add(evt.TITLE_2);
                    let opt = document.createElement('option');
                    opt.value = evt.TITLE_2;
                    opt.textContent = evt.TITLE_2;
                    dropdown.appendChild(opt);
                }
            });
        }

        function getUniqueTitle2s() {
            let seen = new Set(), unique = [];
            allEventsData.forEach(evt => {
                if (!seen.has(evt.TITLE_2)) { seen.add(evt.TITLE_2); unique.push(evt.TITLE_2); }
            });
            return unique;
        }

        // --- Active events list ---
        let activeEventsList = [];

        async function fetchActiveEvents() {
            try {
                let res = await fetch('/api/get_active_events');
                activeEventsList = await res.json();
                updateNextEventBanner();
            } catch(e) { console.error('Failed to fetch active events:', e); }
        }

        function findCurrentInActiveList() {
            if (!activeEventData || !activeEventsList.length) return -1;
            return activeEventsList.findIndex(e =>
                e.event_name === activeEventData.TITLE_2 && e.run === activeEventData.HEAT
            );
        }

        function updateNextEventBanner() {
            if (!activeEventsList.length) return;
            let currentIdx = findCurrentInActiveList();
            let nextEvt = (currentIdx >= 0 && currentIdx < activeEventsList.length - 1)
                ? activeEventsList[currentIdx + 1] : null;
            document.getElementById('nextEventText').textContent = nextEvt
                ? `${nextEvt.event_name} — Heat ${nextEvt.run}` : 'Ingen kommende løp';
            let html = '';
            activeEventsList.forEach((evt, i) => {
                let isCurrent = (i === currentIdx);
                let cls = 'evt-row' + (isCurrent ? ' evt-current' : '') + (evt.finished && !isCurrent ? ' evt-finished' : '');
                let icon = isCurrent
                    ? '<i class="fas fa-play" style="color:#e67e22;font-size:0.8em;"></i>'
                    : '<span style="display:inline-block;width:14px;"></span>';
                let finishedTag = (evt.finished && !isCurrent)
                    ? '<span style="font-size:0.78em;margin-left:auto;opacity:0.6;">Ferdig</span>' : '';
                html += `<div class="${cls}">${icon}<span>${evt.event_name} — Heat ${evt.run}</span>${finishedTag}</div>`;
            });
            document.getElementById('allEventsList').innerHTML = html;
        }

        function findActiveEvent(events) {
            return events.find(e => e.ACTIVE_EVENT === true) || events[events.length - 1] || null;
        }

        // --- Initial load ---
        async function initialLoad() {
            let [configRes, eventsRes] = await Promise.all([
                fetch('/api/get_standing_config').then(r => r.json()),
                fetch('/api/get_event_data').then(r => r.json())
            ]);
            fetchActiveEvents();
            standingConfig = configRes;

            if (Array.isArray(eventsRes)) {
                allEventsData = eventsRes;
            } else if (eventsRes.time_info) {
                allEventsData = [eventsRes];
            }

            populateEventDropdown();
            let active = findActiveEvent(allEventsData);
            if (active) {
                updateActiveHeat(active);
                loadAggregatedForTitle(active.TITLE_2);
                updateRaceBanner();
            }
        }

        // --- Event handlers ---
        document.addEventListener('DOMContentLoaded', function() {
            initialLoad();

            document.getElementById('nextEventBanner').addEventListener('click', function() {
                let panel = document.getElementById('allEventsPanel');
                let open  = panel.style.display === 'block';
                panel.style.display = open ? 'none' : 'block';
                document.getElementById('nebToggle').innerHTML = open ? '&#9660;' : '&#9650;';
            });

            document.getElementById('eventDropdown').addEventListener('change', function() {
                if (this.value === '') {
                    if (activeEventData) loadAggregatedForTitle(activeEventData.TITLE_2);
                } else {
                    loadAggregatedForTitle(this.value);
                }
            });

            document.getElementById('btnPrevHeat').addEventListener('click', function() { browseHeat(-1); });
            document.getElementById('btnNextHeat').addEventListener('click', function() { browseHeat(1); });

            document.getElementById('btnPrevEvent').addEventListener('click', function() {
                let dropdown = document.getElementById('eventDropdown');
                let events = getUniqueTitle2s();
                let idx = events.indexOf(dropdown.value);
                if (idx > 0) { dropdown.value = events[idx - 1]; loadAggregatedForTitle(events[idx - 1]); }
            });

            document.getElementById('btnNextEvent').addEventListener('click', function() {
                let dropdown = document.getElementById('eventDropdown');
                let events = getUniqueTitle2s();
                let idx = events.indexOf(dropdown.value);
                if (idx < events.length - 1) { dropdown.value = events[idx + 1]; loadAggregatedForTitle(events[idx + 1]); }
            });

            initializeWebSocket();
            connectOrbitsWS();
        });

        // --- WebSocket ---
        function initializeWebSocket() {
            let socket = io.connect('http://' + document.domain + ':' + location.port);
            socket.on('connect', function() {
                socket.emit('join', { username: 'speaker_orbits_v1', room: 'default' });
            });

            socket.on('response', function(dataString) {
                try {
                    let data = typeof dataString === 'string' ? JSON.parse(dataString) : dataString;
                    if (data.RACE_TYPE === undefined || data.time_info === undefined) return;
                    let newHash = MD5(JSON.stringify(data));
                    if (newHash === old_results) return;

                    heatBrowseIndex = null;
                    updateHeatNavLabel();
                    updateActiveHeat(data);

                    let idx = allEventsData.findIndex(e => e.TITLE_2 === data.TITLE_2 && e.HEAT === data.HEAT);
                    if (idx >= 0) allEventsData[idx] = data;
                    else allEventsData.push(data);

                    let dropdown = document.getElementById('eventDropdown');
                    if (dropdown.value === '' || dropdown.value === data.TITLE_2) {
                        loadAggregatedForTitle(data.TITLE_2);
                    }

                    old_results = newHash;
                } catch (e) {
                    console.error('Error parsing WebSocket data:', e);
                }
            });
        }
    </script>
</body>
</html>
