<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Title</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js" integrity="sha384-Gr6Lu2Ajx28mzwyVR8CFkULdCU7kMlZ9UthllibdOSo6qAiN+yXNHqtgdTvFXMT4" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: transparent; font-family: 'Inter', sans-serif; }
        body { display: flex; align-items: flex-start; justify-content: flex-start; }

        #app {
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        #app.show { opacity: 1; transform: translateY(0); }

        /* ── Card ── */
        .card {
            display: inline-flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }

        /* Blue top stripe */
        .top-stripe {
            height: 3px;
            background: #4d79ff;
        }

        /* Main body: heat block + title block side by side */
        .body {
            display: flex;
            flex-direction: row;
            align-items: stretch;
        }

        /* ── Heat block ── */
        .heat-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #4d79ff;
            padding: 12px 16px;
            min-width: 62px;
            gap: 0;
        }

        .heat-label {
            font-size: 7px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.65);
            line-height: 1;
            margin-bottom: 2px;
        }

        .heat-number {
            font-size: 30px;
            font-weight: 900;
            color: #fff;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            letter-spacing: -1px;
        }

        .heat-of {
            font-size: 9px;
            font-weight: 600;
            color: rgba(255,255,255,0.50);
            font-variant-numeric: tabular-nums;
            line-height: 1;
            margin-top: 1px;
            transition: opacity 0.2s;
        }

        /* ── Title block ── */
        .title-block {
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(10, 12, 22, 0.97);
            padding: 11px 20px 11px 16px;
            gap: 4px;
        }

        /* Top row: TITLE_1 · EVENT_TYPE */
        .meta-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
        }

        .meta-event {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.30);
            white-space: nowrap;
        }

        .meta-dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(255,255,255,0.18);
            flex-shrink: 0;
        }

        .meta-type {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(77, 121, 255, 0.85);
            white-space: nowrap;
        }

        /* Main: TITLE_2 */
        .class-name {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.3px;
            line-height: 1;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="card">
        <div class="top-stripe" id="top-stripe"></div>
        <div class="body">

            <div class="heat-block" id="heat-block">
                <div class="heat-label">Heat</div>
                <div class="heat-number" id="heat-value">1</div>
                <div class="heat-of"     id="heat-of"    style="opacity:0">/ 1</div>
            </div>

            <div class="title-block">
                <div class="meta-row">
                    <span class="meta-event" id="title-1">—</span>
                    <div class="meta-dot"></div>
                    <span class="meta-type"  id="event-type">—</span>
                </div>
                <div class="class-name" id="title-2">—</div>
            </div>

        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const wsHost = params.get('host') || '192.168.1.50';
    const wsPort = params.get('port') || '7777';
    const scale  = params.get('scale');
    const mirror = params.get('mirror') === '1' || params.get('mirror') === 'true';

    if (scale) {
        document.body.style.transformOrigin = mirror ? 'top right' : 'top left';
        document.body.style.transform = 'scale(' + parseFloat(scale) + ')';
    }

    function render(data) {
        if (!data) return;

        document.getElementById('title-1').textContent    = data.TITLE_1    || '';
        document.getElementById('title-2').textContent    = data.TITLE_2    || '—';
        document.getElementById('event-type').textContent = data.EVENT_TYPE || '—';

        const heat  = data.HEAT  || 1;
        const heats = data.HEATS || 1;

        document.getElementById('heat-value').textContent = heat;
        const ofEl = document.getElementById('heat-of');
        ofEl.textContent  = '/ ' + heats;
        ofEl.style.opacity = heats > 1 ? '1' : '0';

        const orange = ['Finale', 'Stige'].includes(data.EVENT_TYPE);
        const accent = orange ? '#e87c2a' : '#4d79ff';
        document.getElementById('top-stripe').style.background  = accent;
        document.getElementById('heat-block').style.background  = accent;
        document.getElementById('event-type').style.color       = orange ? 'rgba(232,124,42,0.90)' : 'rgba(77,121,255,0.85)';

        document.getElementById('app').classList.add('show');
    }

    const socket = io('http://' + wsHost + ':' + wsPort, { transports: ['websocket', 'polling'] });

    socket.on('connect', function () {
        socket.emit('join', { username: 'overlay', room: 'event_meta' });
    });

    socket.on('response', function (dataString) {
        try {
            const data = typeof dataString === 'string' ? JSON.parse(dataString) : dataString;
            render(data);
        } catch (e) { console.error('[event_title] parse error:', e); }
    });

    socket.on('connect_error', function (e) {
        console.error('[event_title] connection error:', e);
    });
</script>
</body>
</html>
