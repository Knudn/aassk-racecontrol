{% extends 'admin/layout.html' %}
{% block content %}
<style>
    .center-div {
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Arial', sans-serif;
    }
    h2 {
        color: #333;
        font-size: 2em;
        text-align: center;
    }
</style>

<link href="https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>

<div class="center-div">
    {% if returned_event_info == "None" %}
        <h2>Pick the Event</h2>
    {% else %}
        <h2>{{ returned_event_info }}</h2>
    {% endif %}
</div>

<form id="eventForm" method="POST" action="{{ url_for('admin.admin', tab_name='active_events_driver_data') }}">
    <select id="eventDropdown" class="form-select form-select-lg mb-3" name="event_name">
        <option selected>Open this select menu</option>
        {% for event in unique_events %}
            <option value="{{ event[0] }}" data-max-heat="{{ event[1] }}">{{ event[0] }}</option>
        {% endfor %}
    </select>

    <select id="runDropdown" class="form-select form-select-sm" name="run">
        <option selected>Open this select menu</option>
    </select>

    <input type="hidden" name="event_file" id="eventFileInput" value="">

    <div class="d-grid gap-2">
        <button class="btn btn-primary" type="submit">Select</button>
        <button class="btn btn-secondary" type="button" id="activeEventsBtn">Active Event</button>
    </div>
</form>

<script>
    document.getElementById('activeEventsBtn').addEventListener('click', function() {
        document.getElementById('eventFileInput').value = "active_event";
        document.getElementById('eventForm').submit();
    });
</script>

<br>
<div id="driver-stats-table"></div>
<br>

<button id="updateData" class="btn btn-secondary">Update</button>
<button id="refresh_data" class="btn btn-secondary">Reload Event</button>

<script>
    var table;

    document.addEventListener("DOMContentLoaded", function() {
        // Build dynamic columns: CID first, then JSON keys, then LOCKED
        var columns = [
            {title: "CID", field: "CID"}
        ];

        {% if dynamic_keys %}
            {% for key in dynamic_keys %}
                columns.push({title: "{{ key }}", field: "{{ key }}", editor: "input"});
            {% endfor %}
        {% endif %}

        columns.push({title: "Locked", field: "LOCKED", width: 90, hozAlign: "center", formatter: "tickCross", sorter: "boolean", editor: true});

        var tableData = {% if sqldata != "None" %}{{ sqldata|safe }}{% else %}[]{% endif %};

        table = new Tabulator("#driver-stats-table", {
            data: tableData,
            layout: "fitColumns",
            columns: columns,
        });

        document.getElementById("updateData").addEventListener("click", function() {
            if (!table) {
                console.error("Table is not initialized yet.");
                return;
            }

            var tableData = table.getData();
            var combinedData = {
                data: tableData,
                title_2: "{{ event_entry_file.title_2 if event_entry_file != 'None' else '' }}",
                heat: "{{ event_entry_file.heat if event_entry_file != 'None' else '' }}"
            };

            fetch("{{ url_for('admin.admin', tab_name='active_events_driver_data') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(combinedData)
            }).then(response => response.json())
              .then(data => console.log(data));
        });

        document.getElementById("refresh_data").addEventListener("click", function() {
            if (!table) {
                console.error("Table is not initialized yet.");
                return;
            }

            var jsonData = {
                title_2: "{{ event_entry_file.title_2 if event_entry_file != 'None' else '' }}",
                heat: "{{ event_entry_file.heat if event_entry_file != 'None' else '' }}"
            };

            fetch("/api/reload_event", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(jsonData),
            }).then(response => response.json())
              .then(data => console.log(data));
        });
    });

    const eventDropdown = document.getElementById('eventDropdown');
    const runDropdown = document.getElementById('runDropdown');

    eventDropdown.addEventListener('change', function() {
        const selectedOption = this.options[this.selectedIndex];
        const maxHeat = parseInt(selectedOption.getAttribute('data-max-heat'));

        runDropdown.innerHTML = '';
        for (let i = 1; i <= maxHeat; i++) {
            const option = document.createElement('option');
            option.value = i;
            option.text = "Heat " + i;
            runDropdown.add(option);
        }
    });
</script>

{% endblock %}
