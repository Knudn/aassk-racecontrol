<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kvali Standings</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: transparent;
            color: #fff;
        }
        .standings-wrap {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #FFD700;
            border-radius: 8px;
            padding: 16px;
            max-width: 700px;
            margin: 20px auto;
        }
        .standings-title {
            font-size: 22px;
            font-weight: bold;
            color: #FFD700;
            text-align: center;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            background: rgba(255, 215, 0, 0.15);
            color: #FFD700;
            padding: 8px 10px;
            text-align: left;
            border-bottom: 2px solid #FFD700;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
        }
        td {
            padding: 7px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.04);
        }
        tr:hover {
            background: rgba(255, 215, 0, 0.08);
        }
        .pos-cell {
            font-weight: bold;
            color: #FFD700;
            width: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="standings-wrap">
        <div class="standings-title">Kvali test 22</div>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>ID</th>
                    <th>Navn</th>
                    <th>Kjøretøy</th>
                    <th>Beste Rundetid</th>
                    <th>Runder</th>
                    <th>Tid</th>
                    <th>Poeng</th>
                </tr>
            </thead>
            <tbody>
                <tr><td class="pos-cell">1</td><td>9</td><td>Danil Haugå Løyland</td><td>-</td><td>0</td><td>0</td><td>0</td><td>25</td></tr>
                <tr><td class="pos-cell">2</td><td>26</td><td>Kjell Hodn Syversn</td><td>-</td><td>0</td><td>0</td><td>0</td><td>25</td></tr>
                <tr><td class="pos-cell">3</td><td>12</td><td>David Urvan</td><td>-</td><td>0</td><td>0</td><td>0</td><td>24</td></tr>
                <tr><td class="pos-cell">4</td><td>17</td><td>Erlend Rørhol-Hov</td><td>-</td><td>0</td><td>0</td><td>0</td><td>23</td></tr>
            </tbody>
        </table>
    </div>
</body>
</html>
