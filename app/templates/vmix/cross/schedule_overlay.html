<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startprogram</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            background: transparent;
            font-family: 'Inter', 'Arial', sans-serif;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%; height: 100%;
            position: relative;
        }

        /* ── Header ── */
        #page-header {
            flex-shrink: 0;
            align-self: center;
            width: fit-content;
            min-width: 200px;
            padding: 8px 28px;
            text-align: center;
            background: rgba(14, 16, 28, 0.98);
            border-radius: 8px 8px 0 0;
            position: relative;
            z-index: 2;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #page-header.show { opacity: 1; transform: translateY(0); }

        #header-label {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #fff;
            white-space: nowrap;
        }

        /* ── Card ── */
        #card {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(10, 12, 20, 0.97);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.07);
            overflow: hidden;
            z-index: 1;
        }

        /* ── Schedule row — 3-col grid for true centering ── */
        .sched-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            height: 58px;
            padding: 0 28px;
            border-left: 4px solid transparent;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
            opacity: 0;
            transform: translateX(-20px);
            transition: opacity 0.22s ease-out, transform 0.22s ease-out;
        }
        .sched-row:last-child { border-bottom: none; }
        .sched-row.show { opacity: 1; transform: translateX(0); }

        /* State variants */
        .sched-row.is-finished {
            opacity: 0.35 !important;
        }
        .sched-row.is-finished.show {
            opacity: 0.35;
        }
        .sched-row.is-active {
            border-left-color: #e8b840;
            background: rgba(232, 184, 64, 0.06);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.35; }
        }

        /* ── Left spacer (col 1) — holds the LIVE dot ── */
        .col-left {
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: transparent;
        }
        .is-active .status-dot {
            background: #e8b840;
            box-shadow: 0 0 8px rgba(232,184,64,0.65);
            animation: pulse 1.8s ease-in-out infinite;
        }

        /* ── Name column (col 2) — truly centered ── */
        .col-name {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            overflow: hidden;
        }

        .event-name {
            font-size: 16px;
            font-weight: 600;
            color: rgba(255,255,255,0.78);
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }
        .is-active .event-name {
            font-size: 17px;
            font-weight: 800;
            color: #fff;
        }

        /* LIVE badge */
        .live-badge {
            flex-shrink: 0;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: #e8b840;
            background: rgba(232,184,64,0.12);
            border: 1px solid rgba(232,184,64,0.30);
            border-radius: 3px;
            padding: 3px 7px;
            line-height: 1;
        }

        /* ── Heat column (col 3) — right-aligned ── */
        .col-heat {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .heat-label {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255,255,255,0.28);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .is-active .heat-label {
            color: rgba(232,184,64,0.60);
        }
    </style>
</head>
<body>
<div id="app">

    <div id="page-header">
        <span id="header-label">Startprogram</span>
    </div>

    <div id="card">
        <div id="rows"></div>
    </div>

</div>
<script>
    // ── URL params ───────────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);

    (function applyParams() {
        const app    = document.getElementById('app');
        const mirror = params.get('mirror') === '1' || params.get('mirror') === 'true';
        const scale  = params.get('scale');
        const w      = params.get('w');
        const h      = params.get('h');
        if (w) app.style.width  = w + 'px';
        if (h) app.style.height = h + 'px';

        const opacity = params.get('opacity');
        if (opacity !== null) {
            const alpha = Math.min(1, Math.max(0, parseFloat(opacity)));
            document.getElementById('card').style.background = `rgba(10, 12, 20, ${alpha})`;
        }

        if (scale) {
            document.body.style.transformOrigin = mirror ? 'top right' : 'top left';
            document.body.style.transform = 'scale(' + parseFloat(scale) + ')';
        }
    })();

    // ── Build a row ──────────────────────────────────────────────
    function makeRow(entry) {
        const row = document.createElement('div');

        const stateClass = entry.active
            ? 'is-active'
            : entry.finished
                ? 'is-finished'
                : '';
        row.className = 'sched-row' + (stateClass ? ' ' + stateClass : '');

        // Left col — pulsing dot only on active
        const leftCol = document.createElement('div');
        leftCol.className = 'col-left';
        const dot = document.createElement('div');
        dot.className = 'status-dot';
        leftCol.appendChild(dot);
        row.appendChild(leftCol);

        // Name + optional LIVE badge
        const nameCol = document.createElement('div');
        nameCol.className = 'col-name';

        const nameEl = document.createElement('span');
        nameEl.className = 'event-name';
        nameEl.textContent = entry.event_name || '—';
        nameCol.appendChild(nameEl);

        if (entry.active) {
            const badge = document.createElement('span');
            badge.className = 'live-badge';
            badge.textContent = 'LIVE';
            nameCol.appendChild(badge);
        }

        row.appendChild(nameCol);

        // Heat
        const heatCol = document.createElement('div');
        heatCol.className = 'col-heat';
        const heatEl = document.createElement('span');
        heatEl.className = 'heat-label';
        heatEl.textContent = 'Heat ' + (entry.run ?? '—');
        heatCol.appendChild(heatEl);
        row.appendChild(heatCol);

        return row;
    }

    // ── Animation ────────────────────────────────────────────────
    function animateIn() {
        document.getElementById('page-header').classList.add('show');
        document.querySelectorAll('.sched-row').forEach((el, i) => {
            setTimeout(() => el.classList.add('show'), 150 + i * 45);
        });
    }

    // ── Render ───────────────────────────────────────────────────
    function render(data) {
        const container = document.getElementById('rows');
        container.innerHTML = '';

        data.forEach(entry => {
            container.appendChild(makeRow(entry));
        });

        requestAnimationFrame(animateIn);
    }

    // ── Fetch ────────────────────────────────────────────────────
    fetch('http://192.168.1.50:7777/api/get_active_events')
        .then(r => r.json())
        .then(render)
        .catch(e => console.error('[schedule] feil:', e));
</script>
</body>
</html>
