<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startliste Loop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            background: transparent;
            font-family: 'Inter', 'Arial', sans-serif;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #app.show { opacity: 1; transform: translateY(0); }

        /* ── Header ── */
        #page-header {
            align-self: center;
            width: fit-content;
            min-width: 240px;
            padding: 8px 28px 6px;
            text-align: center;
            background: rgba(14, 16, 28, 0.98);
            border-radius: 8px 8px 0 0;
        }
        #title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }
        #result-label {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
        }
        .sep { font-size: 13px; font-weight: 300; color: rgba(255,255,255,0.35); }
        #event-title { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: -0.3px; }
        #heat-label { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.40); }
        #counter-label { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.30); font-variant-numeric: tabular-nums; }

        /* ── Progress bar ── */
        #progress-wrap {
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.08);
            border-radius: 1px;
            margin-top: 6px;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: rgba(255,255,255,0.45);
            border-radius: 1px;
        }

        /* ── Card ── */
        #table-wrap {
            background: rgba(10, 12, 20, 0.97);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 12px;
            padding: 0 16px 14px;
            display: flex;
            flex-direction: column;
        }

        /* ── Column headers ── */
        #col-headers {
            display: flex;
            align-items: center;
            padding: 10px 0 6px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.25s ease 0.1s;
        }
        #col-headers.show { opacity: 1; }
        .ch {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            white-space: nowrap;
            flex-shrink: 0;
            text-align: center;
        }

        /* ── Race row ── */
        .race-row {
            display: flex;
            align-items: center;
            height: 50px;
            flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.05);
            opacity: 0;
            transform: translateX(-14px);
            transition: opacity 0.22s ease-out, transform 0.22s ease-out;
        }
        #rows .race-row:first-child { border-top: none; }
        .race-row.show { opacity: 1; transform: translateX(0); }
        .race-row.is-active { background: rgba(255,255,255,0.03); }

        /* ── Cells ── */
        .cell {
            display: flex;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
            height: 100%;
        }
        .cell.c-cid    { width: 56px;  flex-shrink: 0; justify-content: flex-start; padding: 0 8px 0 16px; }
        .cell.c-cid-r  { width: 56px;  flex-shrink: 0; justify-content: flex-end;   padding: 0 16px 0 8px; }
        .cell.c-name   { flex: 1; min-width: 0; justify-content: flex-start; padding: 0 10px; }
        .cell.c-name-r { flex: 1; min-width: 0; justify-content: flex-end;   padding: 0 10px; }
        .cell.c-info   { width: 200px; flex-shrink: 0; justify-content: center; padding: 0 10px; }
        .cell.c-info-r { width: 200px; flex-shrink: 0; justify-content: center; padding: 0 10px; }
        .cell.c-num    { width: 52px;  flex-shrink: 0; justify-content: center; }
        .cell.c-time   { width: 90px;  flex-shrink: 0; justify-content: center; }

        /* ── Race number ── */
        .val-num {
            font-size: 13px;
            font-weight: 700;
            color: rgba(255,255,255,0.25);
            font-variant-numeric: tabular-nums;
            background: rgba(255,255,255,0.05);
            width: 30px;
            height: 30px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .is-active .val-num { color: rgba(255,255,255,0.70); background: rgba(255,255,255,0.10); }

        /* ── Text values ── */
        .val-name {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .val-cid {
            font-size: 13px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: rgba(255,255,255,0.65);
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            padding: 3px 0;
            width: 44px;
            text-align: center;
            white-space: nowrap;
            flex-shrink: 0;
            letter-spacing: 0.3px;
        }
        .val-info {
            font-size: 11px;
            font-weight: 500;
            color: rgba(255,255,255,0.40);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── Time ── */
        .val-time {
            font-size: 15px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: rgba(255,255,255,0.90);
        }
        .val-time.loser { color: rgba(255,255,255,0.30); font-weight: 500; font-size: 13px; }
        .val-time.empty { color: rgba(255,255,255,0.12); font-weight: 400; font-size: 12px; }
        .val-time.penalty { color: rgba(255,100,100,0.80); }
    </style>
</head>
<body>
    <div id="app">
        <div id="page-header">
            <div id="title-row">
                <span id="result-label">Startliste</span>
                <span class="sep">·</span>
                <span id="event-title">—</span>
                <span class="sep">·</span>
                <span id="heat-label">—</span>
                <span class="sep">·</span>
                <span id="counter-label">— / —</span>
            </div>
            <div id="progress-wrap"><div id="progress-bar"></div></div>
        </div>
        <div id="table-wrap">
            <div id="col-headers">
                <div class="ch" style="width:56px;flex-shrink:0;"></div>
                <div class="ch" style="flex:1;min-width:0;padding:0 10px;text-align:left;">Bane 1</div>
                <div class="ch" style="width:200px;flex-shrink:0;text-align:center;padding:0 10px;">Kjøretøy</div>
                <div class="ch" style="width:90px;flex-shrink:0;">Tid</div>
                <div class="ch" style="width:52px;flex-shrink:0;">#</div>
                <div class="ch" style="width:90px;flex-shrink:0;">Tid</div>
                <div class="ch" style="width:200px;flex-shrink:0;text-align:center;padding:0 10px;">Kjøretøy</div>
                <div class="ch" style="flex:1;min-width:0;padding:0 10px;text-align:right;">Bane 2</div>
                <div class="ch" style="width:56px;flex-shrink:0;"></div>
            </div>
            <div id="rows"></div>
        </div>
    </div>

    <script>
        // ── URL params ────────────────────────────────────────────────
        const params = new URLSearchParams(window.location.search);
        const apiBase = params.get('api') || '';
        const TIMER_SEC = Math.max(3, parseInt(params.get('timer') || '10'));
        const WHITELIST = (params.get('whitelist') || 'kvalifisering').toLowerCase().trim();
        const HEAT_FILTER = params.get('heat') || '';

        (function applyParams() {
            const app = document.getElementById('app');
            const mirror = params.get('mirror') === '1' || params.get('mirror') === 'true';
            const scale = params.get('scale');
            const w = params.get('w');
            const h = params.get('h');
            if (w) app.style.width = w + 'px';
            if (h) app.style.height = h + 'px';

            const opacity = params.get('opacity');
            if (opacity !== null) {
                const alpha = Math.min(1, Math.max(0, parseFloat(opacity)));
                document.getElementById('table-wrap').style.background = `rgba(10, 12, 20, ${alpha})`;
            }

            if (scale) {
                document.body.style.transformOrigin = mirror ? 'top right' : 'top left';
                document.body.style.transform = 'scale(' + parseFloat(scale) + ')';
            }

            const pos = params.get('pos');
            if (pos) {
                document.body.style.display = 'flex';
                document.body.style.flexDirection = 'column';
                document.body.style.height = '100vh';
                const posMap = { top: 'flex-start', center: 'center', bottom: 'flex-end' };
                document.body.style.justifyContent = posMap[pos] || 'flex-start';
            }
        })();

        // ── Helpers ──────────────────────────────────────────────────
        const PENALTY_CODES = { 1: 'DNS', 2: 'DNF', 3: 'DSQ' };

        function msToSec(ms) {
            if (!ms || ms <= 0) return null;
            return (ms / 1000).toFixed(3);
        }

        function formatName(f, l) {
            const fn = (f || '').trim(), ln = (l || '').trim();
            if (!fn && !ln) return '—';
            return (fn + ' ' + ln).trim();
        }

        function div(cls) { const e = document.createElement('div'); if (cls) e.className = cls; return e; }
        function span(cls, txt) { const e = document.createElement('span'); e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }

        function timeSpan(driver) {
            const ti = driver.time_info || {};
            const pen = ti.PENELTY || 0;
            const ft = ti.FINISHTIME || 0;
            const penLabel = PENALTY_CODES[pen];
            const status = driver.status || 0;
            if (penLabel) return span('val-time penalty', penLabel);
            const sec = msToSec(ft);
            if (!sec) return span('val-time empty', '—');
            return span('val-time' + (status === 2 ? ' loser' : ''), sec);
        }

        function buildRow(raceId, drivers, active) {
            const d1 = drivers[0], d2 = drivers[1];
            const row = div('race-row' + (active ? ' is-active' : ''));

            const cid1 = div('cell c-cid');
            if (d1?.id) cid1.appendChild(span('val-cid', String(d1.id)));
            row.appendChild(cid1);

            const name1 = div('cell c-name');
            if (d1) name1.appendChild(span('val-name', formatName(d1.first_name, d1.last_name)));
            row.appendChild(name1);

            const info1 = div('cell c-info');
            if (d1) info1.appendChild(span('val-info', d1.vehicle || '—'));
            row.appendChild(info1);

            const t1 = div('cell c-time');
            if (d1) t1.appendChild(timeSpan(d1));
            row.appendChild(t1);

            const numCell = div('cell c-num');
            const badge = div('val-num');
            badge.textContent = raceId;
            numCell.appendChild(badge);
            row.appendChild(numCell);

            const t2 = div('cell c-time');
            if (d2) t2.appendChild(timeSpan(d2));
            row.appendChild(t2);

            const info2 = div('cell c-info-r');
            if (d2) info2.appendChild(span('val-info', d2.vehicle || '—'));
            row.appendChild(info2);

            const name2 = div('cell c-name-r');
            if (d2) name2.appendChild(span('val-name', formatName(d2.first_name, d2.last_name)));
            row.appendChild(name2);

            const cid2 = div('cell c-cid-r');
            if (d2?.id) cid2.appendChild(span('val-cid', String(d2.id)));
            row.appendChild(cid2);

            return row;
        }

        // ── Animate ──────────────────────────────────────────────────
        function animateIn() {
            document.getElementById('app').classList.add('show');
            document.getElementById('col-headers').classList.add('show');
            document.querySelectorAll('.race-row').forEach((el, i) =>
                setTimeout(() => el.classList.add('show'), 150 + i * 40)
            );
        }

        function animateOut(cb) {
            document.getElementById('col-headers').classList.remove('show');
            document.querySelectorAll('.race-row').forEach(el => el.classList.remove('show'));
            setTimeout(cb, 320);
        }

        // ── Render ────────────────────────────────────────────────────
        function render(data) {
            const config = (data[0] || {}).race_config || {};
            const races = data.slice(1);

            document.getElementById('event-title').textContent = (config.TITLE_2 || config.TITLE_1 || '—').trim();
            document.getElementById('heat-label').textContent =
                config.HEATS > 1 ? `Heat ${config.HEAT} / ${config.HEATS}` : '';

            const container = document.getElementById('rows');
            container.innerHTML = '';

            races.forEach(race => {
                const drivers = race.drivers || [];
                const active = drivers.some(d => d.active);
                container.appendChild(buildRow(race.race_id, drivers, active));
            });
        }

        // ── Progress bar ──────────────────────────────────────────────
        function startProgress() {
            const bar = document.getElementById('progress-bar');
            bar.style.transition = 'none';
            bar.style.width = '0%';
            requestAnimationFrame(() => requestAnimationFrame(() => {
                bar.style.transition = `width ${TIMER_SEC}s linear`;
                bar.style.width = '100%';
            }));
        }

        function resetProgress() {
            const bar = document.getElementById('progress-bar');
            bar.style.transition = 'none';
            bar.style.width = '0%';
        }

        // ── Loop state ────────────────────────────────────────────────
        let slides = [];  // [{event_name, heat}]
        let loopIdx = 0;
        let slideTimer = null;

        function updateCounter() {
            document.getElementById('counter-label').textContent =
                slides.length > 0 ? `${loopIdx + 1} / ${slides.length}` : '— / —';
        }

        function showAndSchedule() {
            const slide = slides[loopIdx];
            const qs = new URLSearchParams({ event: slide.event_name, heat: slide.heat });

            fetch(`${apiBase}/api/get_current_startlist_w_data?${qs}`)
                .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
                .then(data => {
                    if (!Array.isArray(data) || !data[0]?.race_config) throw new Error('bad data');
                    if (data.slice(1).length === 0) throw new Error('empty');
                    render(data);
                    updateCounter();

                    // First slide: animate the app in, subsequent: just animate rows
                    if (!document.getElementById('app').classList.contains('show')) {
                        animateIn();
                    } else {
                        document.getElementById('col-headers').classList.add('show');
                        document.querySelectorAll('.race-row').forEach((el, i) =>
                            setTimeout(() => el.classList.add('show'), 100 + i * 40)
                        );
                    }

                    startProgress();
                    clearTimeout(slideTimer);
                    slideTimer = setTimeout(() => {
                        animateOut(() => {
                            resetProgress();
                            loopIdx = (loopIdx + 1) % slides.length;
                            showAndSchedule();
                        });
                    }, TIMER_SEC * 1000);
                })
                .catch(e => {
                    console.warn(`[loop] hopper over "${slide.event_name}" heat ${slide.heat}:`, e.message);
                    loopIdx = (loopIdx + 1) % slides.length;
                    showAndSchedule();
                });
        }

        // ── Init ─────────────────────────────────────────────────────
        function loadEventList() {
            fetch(`${apiBase}/api/get_active_events`)
                .then(r => r.json())
                .then(data => {
                    let entries = data;

                    if (WHITELIST) {
                        entries = entries.filter(e => e.event_name.toLowerCase().includes(WHITELIST));
                    }

                    if (HEAT_FILTER) {
                        entries = entries.filter(e => String(e.run) === String(HEAT_FILTER));
                    }

                    slides = entries.map(e => ({ event_name: e.event_name, heat: e.run }));

                    if (slides.length === 0) {
                        console.warn('[loop] ingen hendelser matcher filtrene');
                        return;
                    }

                    loopIdx = 0;
                    showAndSchedule();
                })
                .catch(e => console.error('[loop] feil ved lasting av hendelser:', e));
        }

        loadEventList();
    </script>
</body>
</html>
